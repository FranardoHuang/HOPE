wbc_runner:
  ros__parameters:
    # --- mode + safety gate ---
    # dry_run (default) = log only, NEVER publishes; shadow = predict on real state, no publish;
    # hardware = publish joint cmds ONLY when hardware_enable AND !estop.
    mode: "dry_run"
    hardware_enable: false
    estop_topic: "/hope/estop"
    enable_topic: "/hope/hardware_enable"

    # --- policy ---
    onnx_path: ""            # REQUIRED: .../exported/policy.onnx (re-exported with BOTH clips, ~1.24 MB)
    std_path: ""             # optional; only used if dither_scale > 0
    dither_scale: 0.0        # 0 = deterministic (recommended; dither not needed and hurts backhand)
    control_rate_hz: 50.0    # MUST be 50 Hz (training control rate)

    # --- reference clip layout (FALLBACK ONLY) ---
    # The runner reads clip_seg_lengths / clip_strike_phases from the ONNX metadata
    # (baked at export) and OVERRIDES these values when present. These fallbacks are
    # only used for old exports without the metadata — keep them matched to the model
    # you actually load (model_15200 era: [95,105]/[0.36,0.50]; model_9000/v4 clips:
    # per-export, e.g. strike phases [0.47, 0.333]).
    seg_len: [95, 105]       # (forehand, backhand) frame counts
    strike_phase: [0.36, 0.50]   # (forehand, backhand) contact phase

    # --- command handling ---
    command_timeout_s: 0.5   # stale /racket/command -> idle (hold stand pose)
    base_target_xy: [0.0, 0.0]   # desired base XY (POLICY frame; [0,0] = hold the start position)
    # The real planner stops publishing / flips to valid=False the instant the ball
    # passes the hit plane — that is EXPECTED mid-swing. If that happens with the strike
    # imminent (tts <= latch_commit_tts_s), finish the swing through the clip's
    # follow-through instead of snapping to stand; during the wind-up it still aborts.
    latch_swing_completion: true
    latch_commit_tts_s: 0.35

    # --- sim2real frame alignment: HOPE table frame -> policy frame ---
    # The mocap chain (avatar_pro relay -> hope_planner -> /racket/command frame_id
    # "world", and /P1/pose) speaks the HOPE TABLE frame: origin at P1's near-side LEFT
    # table corner ON the table surface, +x toward the opponent, z=0 at the surface
    # (floor = -0.76). The policy was trained in the ENV-ORIGIN frame: origin on the
    # FLOOR under the robot's boot base_link, +x = robot boot heading. The runner
    # converts with a rigid yaw-only transform built from the values below.
    robot_start_xy_table: [-0.5, -0.7625]  # MEASURE: boot base_link ground XY in the table frame
    robot_start_yaw_table: 0.0   # PLACEMENT CONVENTION: robot boots FACING +x (the opponent). Radians.
    table_floor_z: -0.76         # floor z in the table frame (surface z = 0)
    origin_autocapture: true     # refine origin XY from the first N /P1/pose samples (robot stands still)
    origin_capture_samples: 60
    marker_to_base_xyz: [0.0, 0.0, 0.0]  # MEASURE: P1 marker-cluster -> base_link offset (base frame, m)
    use_mocap_orientation: false # arena mocap is POSITION-ONLY: keep false (IMU orientation used)
    imu_yaw_align: true          # re-zero the drifting pelvis-IMU yaw at boot (robot standing still)
    imu_yaw_align_samples: 100
    base_pose_timeout_s: 0.5     # /P1/pose older than this -> nominal fallback + warn

    # --- target reachability gate (base-relative; out-of-distribution target -> stand) ---
    # Defaults = union of the model_15200 + model_9000 validated boxes + margin.
    # Tighten per-model for hardware (model_9000: x [0.56,0.78], z [0.72,1.13]).
    target_gate_enable: true
    target_gate_x: [0.20, 0.90]
    target_gate_y_abs: 0.85
    target_gate_z: [0.55, 1.40]
    target_gate_speed_max: 3.5

    # --- state source ---
    state_source: "synthetic"    # synthetic (dry-run, perfect-tracking) | ros (subscribe joints+imu)
    joint_state_topic: "/a3/joint_states"   # robot joint feedback (shadow/hardware)
    # AGI backend publishes joint_msgs/JointState (not sensor_msgs); the bridge merges
    # the 4 body-drive topics into /a3/joint_states still using joint_msgs format.
    joint_state_type: "joint_msgs"           # "sensor_msgs" (std JointState) | "joint_msgs" (a3 sim JointState)
    imu_topic: "/a3/imu"                     # sensor_msgs/Imu (orientation + body-frame gyro)
    # Set to /P1/pose when the AvatarPro mocap is running — gives the policy the real
    # robot world position so the racket-target-relative-to-base obs is correct.
    # Leave "" for standalone dry-run (no mocap): uses nominal height fallback.
    base_pose_topic: "/P1/pose"             # geometry_msgs/PoseStamped pelvis world pose (from mocap relay)
    nominal_base_height: 0.95    # fallback pelvis z when no base_pose_topic (sim2real localisation gap)
    torso_offset_z: 0.20         # fallback torso-above-pelvis z

    # --- output ---
    joint_command_topic: "/a3/joint_command"  # joint_msgs/JointCommand (hardware mode only)

    # --- logging ---
    csv_path: ""             # e.g. "/tmp/wbc_runner.csv"; "" disables
