# SIM PROFILE overlay for hope_planner.yaml — AGI MuJoCo closed-loop (Gate 3).
# Layered on top of hope_planner.yaml as a second --params-file (pp_planner_closedloop.sh / runbook §7).
# Convention: sim world == table world, robot at origin, ground-truth pelvis pose
# available on /sim/a3/pelvis_pose. Keep every sim-only deviation HERE (the base yaml
# stays the arena/hardware truth); never edit the installed tree.
hope_planner:
  ros__parameters:
    # --- 每 tick 全精度求解(franco 2026-07-07 定版;这里显式写出与节点默认一致,防漂移)---
    # 双档粒度作废:快路径转正(整 tick 预测+反解 ~2ms 实测),每个策略 tick 全精度重算。
    publish_strike_spec: true
    use_fast_strike_spec: true
    # Gate3 source/runtime contracts bind the production solver only. Enabling
    # shadow changes callback timing and dependency closure, so it is fail-closed here.
    use_shadow_solver: false
    strike_spec_rate_hz: 50.0
    dt_integrate_coarse: 0.02   # 自适应巡航步长;事件区间自动退回 1ms 细步(过网/弹跳/命中面)
    # Gate3 long serves arrive around 1.89 s. Keep early-fit noise away from
    # the old 2.0 s validity cliff, and solve at ~30 Hz so the 300 Hz ball
    # callback cannot starve /sim/a3/pelvis_pose in a single-threaded executor.
    # This horizon does not authorize early swing: formal179 waits until TTS
    # enters the explicitly selected clip's metadata-derived windup window.
    max_predict_time: 2.6
    solve_period_s: 0.033
    # Match C++ --external-base-max-age; stale yaw must revoke formal side.
    base_pose_max_age_s: 0.2
    ball_source_stamp_max_age_s: 0.2
    source_stamp_future_tolerance_s: 0.02
    use_sim_time: false
    formal_source_clock_mode: "system"
    # Producer-header authority is explicit even though the sim coordinates
    # are numerically one world: fake_ball publishes `world`, while the vendor
    # pose_sensor_ros2 config labels /sim/a3/pelvis_pose as `odom`.
    formal_ball_source_frame_id: "world"
    formal_base_source_frame_id: "odom"
    # No planner TF/rigid transform is bound, so this intentional producer
    # mismatch blocks formal schema-3 startup until one publisher is relabelled
    # from the same numeric frame (preferred: fake_ball -> odom) or an exact
    # transform contract is implemented.
    formal_common_frame_required: true
    # Formal 179 requires payload epoch/sequence/source-age causality. Schema 2
    # remains parseable only for non-formal legacy rehearsal.
    racket_flat_schema: 3

    # Ball physics MUST match fake_ball_publisher's defaults (drag 0.15 / rest 0.85) —
    # the base yaml keeps the arena-fit placeholders. Mismatch -> predicted ball dies
    # before the hit plane -> strike plans at floor level -> target gate rejects all.
    drag_k: 0.15
    restitution_h: 0.85
    restitution_v: 0.85
    # softer returns: keeps the demanded racket speed near the trained ~2.2 m/s envelope
    delta_t_flight: 0.7
    # ADAPTIVE hit plane from the sim ground-truth pelvis pose (sim world == table frame).
    # This is the current 175/177 multi-swing profile: after the lunge the robot stands at
    # the old plane, so following the robot keeps later serves reachable. The 110-D
    # HitterPure gate overrides this with x_hit_follow_robot:=false; do not use follow-mode
    # with an x-locked policy because it hides the policy's own x drift.
    x_hit_follow_robot: true
    robot_pose_topic: "/sim/a3/pelvis_pose"
    marker_to_base_xyz: [0.0, 0.0, 0.0]
    x_hit_offset: 0.67
    # clamp = the training-box regime: pin the plane inside a fixed window so post-lunge
    # regression stays the small trained back-step, never a long untrained walk-back.
    # (No physical table in the sim -> window centered on the spawn-forward strike zone.)
    x_hit_min: 0.55
    x_hit_max: 2.20
    # static fallback while no robot pose has arrived yet
    x_hit: 0.65
    # Sim harness centers the table on the robot (robot at y=0): table y in [-0.7825, +0.7825].
    # Without this the predictor uses the ARENA band [-1.545,+0.02] and every backhand serve
    # is off-table: no bounce modeled -> dead-ball plans -> zero backhand engages (2026-07-05).
    table_y_max: 0.7825
    # Return AIM POINT for the same centered table. The base yaml's -0.7625 is the ARENA
    # convention (table at y<=0); left un-overridden it aims every return at the sim
    # table's right EDGE, which skews the demanded racket vy NEGATIVE on forehand
    # (-0.30 vs the trained [+0.96,+1.96] box — wrong sign). 0.0 = opponent half
    # centerline in the centered sim frame (2026-07-06 fix; the 2026-07-05 table_y_max
    # override fixed only the PREDICTOR band, not the aim).
    target_land_y: 0.0
    # Sim feeds (/sim/a3/pelvis_pose + fake_ball) are ALREADY floor-origin (the policy
    # frame) -> no output z shift. The arena yaml sets 0.76 (mocap z=0 at table surface).
    policy_z_offset: 0.0
