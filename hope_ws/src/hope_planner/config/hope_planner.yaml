hope_planner:
  ros__parameters:
    ball_rigid_body_name: "pingpong_ball"
    # ball_pose_index: which slot in the /poses PoseArray is the ball.
    # HOW TO GET: with the avatar_pro relay this is 0 (pose_array_order starts with
    # "ball"). Confirm against your live stream: `ros2 topic echo /poses --once`
    # and count the ball's index. TODO: confirm against your live /poses.
    ball_pose_index: 0
    # Virtual hit plane X (m); ~0.0 = HOPE origin end of table. MUST be matched to the
    # ROBOT PLACEMENT: the policy strikes ~0.55-0.80 m in front of its base, so
    # x_hit ≈ robot_start_x + 0.65 (e.g. robot at x=-0.5 -> x_hit ≈ 0.15). Targets the
    # swing can't reach are rejected by the wbc_runner's base-relative target gate
    # (idle_reason=target_gate in its diagnostics) — if you see that constantly,
    # x_hit and robot_start_xy_table (wbc_runner.yaml) disagree.
    x_hit: 0.0
    target_land_x: 2.055   # opponent half-center X (fixed by table geometry)
    target_land_y: -0.7625 # opponent half-center Y (fixed by table geometry)
    delta_t_flight: 0.5    # desired return flight time (s); tune for your robot
    # TODO(calibrate): drag + restitution. Defaults are reasonable starting points
    # from the HITTER paper. HOW TO GET: record >=15 ball trajectories with the
    # mocap, export to CSV (t,x,y,z), then run
    #   ros2 run hope_planner hope_calibrate traj1.csv ... traj15.csv
    # and paste the printed values here (see reimplement.md Section 8).
    drag_k: 0.8781         # Calibrated from salvaged traj01 split into 15 toss chunks.
    restitution_h: 0.8527  # Calibrated from salvaged traj01 split into 15 toss chunks.
    restitution_v: 0.8518  # Calibrated from salvaged traj01 split into 15 toss chunks.
    restitution_racket: 0.88  # TODO: calibrate (ball-racket restitution)
