# Runtime config for the model_15200 ping-pong runner (a3_deploy_onnx_ref_pingpong).
# This runner reads: onnx.model_path, policy_driver.policy_hz, the backend block,
# and obs_debug (localization mode). Paths are relative to THIS file's directory.
#
# DURABLE SOURCE OF TRUTH. The package builder stages this into dist/.../config/.
# (Previously this file lived only under dist/, which build_a3_deploy_pkg.sh wipes
# on every build -> the runner asset was silently dropped. Keep it here in src.)
onnx:
  # Keep the SOURCE config valid inside the repo tree: from src/.../config this resolves under
  # assets/a3_runtime/models/. During packaging, build_a3_deploy_pkg.sh copies the model into
  # dist/.../models/ and rewrites the packaged runtime cfg to `models/...`. The runner
  # auto-detects obs dim from the ONNX input and builds obs 175 vs 180 accordingly.
  #
  # CURRENT: model_7500_hopex.onnx (2026-07-03, run 2026-07-03_13-32-07 model_7500) —
  # 175-D deploy_parity, hopex RE-GROUNDED clips baked (== registry sources
  # hope_forehand:v2 / hope_backhand:v1; seg 139/132, strike phases 0.470/0.333 in
  # metadata). ⚠ do NOT bake v4 clips for this lineage — a v4-baked export of the same
  # weights failed the gate (vel err 2.6 m/s, 1 fall). Deploy-faithful MuJoCo gate
  # (implicit PD, hopex clips): composite 1.0 BOTH clips, 7/7 swings, 0 falls,
  # pos err 4.1 cm, vel err 0.20 m/s. Training health @7k: Isaac composite 0.64,
  # pos_pass 0.97, falls pre 1.4% / post 0.1%. C++ parity PASS (9.5e-7).
  # Same target boxes as model_9000 (pp_policy.hpp scripted targets remain valid).
  # ⚠ same walk-and-strike caveats as model_9000: footwork only closes the loop with a real
  # localization source. Validate in AGI MuJoCo with BOTH --loc-mode perfect_tracking AND
  # --oracle-pelvis before any hardware decision; if perfect_tracking degrades, hardware
  # needs mocap.
  # PREVIOUS: model_9000_replane.onnx (2026-07-03_02-01-17; deploy-faithful gate 7/7 incl.
  # backhand, 0 falls). FALLBACK: model_p4_deployparity.onnx (forehand-only, strikes in
  # place — the safe hardware fallback; needs --no-imu-yaw for its validated behavior).
  model_path: ../../../../assets/a3_runtime/models/model_16400_holdfix.onnx
  # The pingpong runner runs its ONNX on the CPU via the bundled onnxruntime — on rockchip too.
  # no_rknn tells build_a3_deploy_pkg.sh NOT to auto-promote to the RKNN/NPU path (which would
  # SystemExit on a missing <model>.rknn and block the standard rockchip staging).
  backend: no_rknn

policy_driver:
  policy_hz: 50.0

obs_debug:
  # HARDWARE-SAFE default. fabricated synthesizes a fictional world-tracking error
  # (the documented "deploy buzz" mode) and must NOT be used on hardware. The
  # A/B/C rehearsal selects fabricated/oracle explicitly via --loc-mode.
  loc_mode: perfect_tracking   # fabricated | perfect_tracking | oracle(sim-only)

backend:
  # PURE-iceoryx cfg (no ros2_plugin) to match the iceoryx-only sim cfg and avoid
  # the ABI-mismatched prebuilt libaimrt_ros2_plugin.so. For the real robot use
  # a3_aimrt_config.ros2.yaml (rebuilt in-box) instead.
  aimrt_cfg_path: a3_aimrt_config.pingpong_iceoryx.yaml
  sync_mode: min_skew_pair
  sync_hz: 100.0
