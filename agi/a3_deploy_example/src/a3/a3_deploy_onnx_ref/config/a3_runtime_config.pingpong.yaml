# Runtime config for the model_15200 ping-pong runner (a3_deploy_onnx_ref_pingpong).
# This runner reads: onnx.model_path, policy_driver.policy_hz, the backend block,
# and obs_debug (localization mode). Paths are relative to THIS file's directory.
#
# DURABLE SOURCE OF TRUTH. The package builder stages this into dist/.../config/.
# (Previously this file lived only under dist/, which build_a3_deploy_pkg.sh wipes
# on every build -> the runner asset was silently dropped. Keep it here in src.)
onnx:
  # Keep the SOURCE config valid inside the repo tree: from src/.../config this resolves under
  # assets/a3_runtime/models/. During packaging, build_a3_deploy_pkg.sh copies the model into
  # dist/.../models/ and rewrites the packaged runtime cfg to `models/...`. The runner
  # auto-detects obs dim from the ONNX input and builds obs 110/175/177/180 accordingly.
  #
  # CURRENT: model_17400_hitter177.onnx (2026-07-06, run 2026-07-06_00-56-46 model_17400) —
  # 177-D hitter_footwork (deploy_parity + base_target_pos_b(2) station channel), hopex
  # RE-GROUNDED clips baked (seg 139/132, strike phases 0.470/0.333 in metadata) + the new
  # actor_obs_contract / ref_reach_offset_xy keys (fh +0.700,-0.409 / bh +0.706,+0.185 —
  # the runner derives the base station from them). Verification chain 2026-07-06:
  # Isaac det composite 0.993; C++ parity 2e-7; training-side deploy-faithful gate 0 falls
  # x3 seeds / completion 1.0 / composite 0.966; Gate 2.5 ORACLE 10/10 (incl. 20 s hold +
  # post-swing hold — the 175-era killers); Gate 3 closed loop 10/10 points on the
  # 10-placement serve sweep.
  # ⚠ 177 HARD REQUIREMENT: real base localization (sim --oracle-pelvis / hardware mocap
  # external_base). The station obs feeds BOTH footwork and the hold/recovery anchor;
  # without it the channel degrades to the Δ=0 dropout fallback (strike-in-place, NO hold
  # anchor — post-swing holds tip over: Gate 2.5 perfect_tracking P3b). Do not arm MOTION
  # on hardware without the mocap relay alive.
  # PREVIOUS: model_7500_hopex.onnx (175-D, 2026-07-03_13-32-07; deploy-faithful gate
  # composite 1.0 both clips, 0 falls; works WITHOUT mocap — the mocap-less fallback).
  # FALLBACK (no mocap, forehand-only): model_p4_deployparity.onnx (strikes in place;
  # needs --no-imu-yaw for its validated behavior).
  # Keep the last hardware-shipped artifact as the default. HitterPure successors are selected
  # explicitly only after their ONNX hash, restore path, rockchip build, and hardware G2 are recorded.
  model_path: ../../../../assets/a3_runtime/models/model_17400_hitter177.onnx
  # The pingpong runner runs its ONNX on the CPU via the bundled onnxruntime — on rockchip too.
  # no_rknn tells build_a3_deploy_pkg.sh NOT to auto-promote to the RKNN/NPU path (which would
  # SystemExit on a missing <model>.rknn and block the standard rockchip staging).
  backend: no_rknn

policy_driver:
  policy_hz: 50.0
  # Independent command supervisor. At 50 Hz one period is 20 ms; if a
  # publish-capable callback has not returned within 15 ms, latch a fault,
  # issue zero-gain safe halt, and require a process restart. SHADOW and
  # --no-publish remain diagnostic-only and never emit the supervisor halt.
  command_deadline_ms: 15.0

obs_debug:
  # DIAGNOSTIC default only. With the default 177-D model, publish-capable startup now
  # FAILS CLOSED in perfect_tracking because the required station channel would silently
  # collapse to delta=0. `--planner` automatically selects external_base (live mocap);
  # simulation must select oracle explicitly. perfect_tracking/fabricated are permitted
  # for this 177 artifact only under process-wide --no-publish A/B diagnostics.
  loc_mode: perfect_tracking   # fabricated | perfect_tracking | oracle(sim-only) | external_base
  # Read-only, sim-only joined-source diagnostic sidecar used exclusively by
  # --first-tick-json. Vendor topics lack a common sim-sample sequence, so this
  # is never same-tick/formal evidence.
  # The runner never creates this file and rejects symlinks, stale/partial
  # records, non-0600 ownership, and cross-source timing skew. Normal runs do
  # not open it. See scripts/gate3_first_tick_state_bridge.py.
  first_tick_state_shm_path: /dev/shm/pp_gate3_first_tick_state_v1

backend:
  # PURE-iceoryx cfg (no ros2_plugin) to match the iceoryx-only sim cfg and avoid
  # the ABI-mismatched prebuilt libaimrt_ros2_plugin.so. For the real robot use
  # a3_aimrt_config.ros2.yaml (rebuilt in-box) instead.
  aimrt_cfg_path: a3_aimrt_config.pingpong_iceoryx.yaml
  sync_mode: min_skew_pair
  sync_hz: 100.0
