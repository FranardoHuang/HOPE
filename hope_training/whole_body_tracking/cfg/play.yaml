# =============================================================================
# Hydra eval/export config for HOPE Agibot A3 WBC (106B-Final-Project style).
#
# Usage:
#   python scripts/play.py task=HOPEPingPongDeployParity algo=ppo num_envs=2 \
#       wandb_path=<entity>/hope_wbc/<run_id>
#
# Loads the trained policy from a wandb run (largest model_*.pt), runs it, and
# exports policy.onnx next to the checkpoint (step 15). Without wandb_path it
# falls back to the latest local checkpoint under logs/rsl_rl/<experiment>/.
# =============================================================================

defaults:
  - task: HOPEPingPongDeployParity
  - algo: ppo
  - _self_

headless: false
device: cuda:0
seed: 0
num_envs: 2

wandb_path: null      # <entity>/hope_wbc/<run_id>  (a trained run to load)
checkpoint: null      # explicit local model_*.pt path (takes precedence over wandb_path / latest-local)
export_dir: null      # optional isolated output directory (default: <checkpoint_dir>/exported)
registry_name: null   # motion override for the local-checkpoint path (falls back to task.registry_name)
registry_name_2: null # optional 2nd registry clip for unified policies
motion_file: null     # explicit motion .npz override
motion_file_2: null   # optional 2nd local clip for unified policies

video: false
video_length: 200
export_only: false    # build + validate + export, then exit without entering the rollout loop
post_swing_capture_max_steps: 0 # >0 only with task.motion.post_swing_capture_output_dir

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
