# =============================================================================
# Main Hydra config for HOPE Agibot A3 WBC training (106B-Final-Project style).
#
# Usage:
#   python scripts/train.py task=HOPEPingPongDeployParity algo=ppo headless=true \
#       registry_name=<entity>/wandb-registry-motions/hope_forehand
#
# Pick the task/algo YAML with `task=...` / `algo=...`; override any field on the
# CLI (e.g. num_envs=2048 max_iterations=20000 seed=1 task.rewards.racket_position_weight=5).
# =============================================================================

defaults:
  - task: HOPEPingPongDeployParity
  - algo: ppo
  - _self_

headless: true
device: cuda:0
seed: 0

# Override the task defaults when set (null -> use the task/algo YAML value).
num_envs: null
max_iterations: null
motion_file: null       # optional local .npz reference or list; takes precedence over registry_name
motion_file_2: null     # optional 2nd local clip for unified HITTER policy; used only with motion_file
registry_name: null     # falls back to task.registry_name when null
registry_name_2: null   # optional 2nd clip for the unified HITTER policy (backhand); falls back to task.registry_name_2
run_name: null
# Resume / curriculum hand-off: load model+optimizer from a prior run's checkpoint and CONTINUE training
# (iteration counter + wandb step continue from the checkpoint). null -> fresh init. Use this to apply a
# staged config change (e.g. tightening racket_velocity_std) WITHOUT throwing away progress:
#   checkpoint_path=logs/rsl_rl/agibot_a3_hope/<run>/model_2000.pt
checkpoint_path: null
# With checkpoint_tolerant=true, checkpoint_path warm-starts ACROSS critic-layout changes
# (actor loads by name; mismatched critic re-initializes — deliberate warm-start semantics).
# Plain resume stays strict.
checkpoint_tolerant: false

# logging
logger: wandb           # wandb | tensorboard | neptune
log_project_name: hope_wbc

# video capture (off by default)
video: false
video_length: 200
video_interval: 2000

# keep the working directory at the launch dir so logs/ lands next to the legacy script's logs
hydra:
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
