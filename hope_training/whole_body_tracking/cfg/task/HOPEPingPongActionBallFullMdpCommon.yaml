# Common, non-launchable source for the fresh continuous full-MDP A/C pair.
#
# The registered A/C leaves own family identity in Python.  This YAML contains
# no numeric family gain: the constructed C10 authority must derive A=1/C=0
# from the exact EnvCfg type.  It deliberately does not compose the legacy
# ActionBall task recipe: the inherited Python observation/reward graph is only
# a construction-HOLD scaffold until R08/R03 replace it once for both families.

name: HOPEPingPongActionBallFullMdpCommon
experiment_name: agibot_a3_hope_action_ball_full_mdp

action_ball_full_mdp_runtime: true
# Exact, code-owned 61-update H48 timing lane.  False is the only normal
# training value; the operator may set it true only for the profiler-off
# diagnostic described in the operations TODO.  It never changes the typed
# 100,000-update learning recipe or authorizes a checkpoint lineage.
action_ball_full_mdp_rate_probe: false
action_ball_full_mdp_profile_probe: false
actor_obs_contract: null
registry_name: null
registry_name_2: null

# Fresh A/C share one Take061 physical-ready, hold-q_des and teacher source.
# The dependency-free typed PPO recipe owns every policy number and
# parameterization; YAML only selects the already validated bootstrap
# transformation.
action_ball_full_mdp_policy_bootstrap:
  kind: a3_take061_dynamic_ready_head_v1

# Legacy one-ball drivers are not a substitute for the capacity-derived K-body
# fresh scene.  The Python EnvCfg repeats and enforces these tombstones.
physical_ball: false
table_obstacle: true

env:
  # Static composition agrees with the typed recipe.  The Python recipe is the
  # sole executable authority and rejects any different resolved value.
  num_envs: 512

motion:
  # The active curriculum is explicitly N=1. Preserve the independently
  # reviewed stable-ready -> measured-frame0 seam; D05 still owns when the
  # teacher becomes visible and R07 remains recovery evidence, not admission.
  action_ball_diagnostic_split_ready_teacher: true
  action_ball_single_stroke_timeout_enabled: false

racket:
  # Exact fresh identity.  Python repeats this invariant so a composed legacy
  # ActionBall value cannot select its one-shot sampler by inheritance.
  target_mode: action_ball_full_mdp
  # Until all full-MDP gates close, any finite probe remains diagnostic-only;
  # it cannot be promoted, exported or presented as formal physics evidence.
  action_ball_diagnostic_unauthorized: true
  virtual_ball: false
  vb_metrics_only: false
