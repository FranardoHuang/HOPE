# =============================================================================
# HOPE ping-pong WBC task (Agibot A3) — deploy-parity actor observation.
#
# Selected with `task=HOPEPingPongDeployParity`. This is the SAFE training path
# for sim-to-real work: the actor observation drops every world-frame
# base-position dependency (motion_anchor_pos_b, base_target_pos_b) and reframes
# racket_target_pos_b to be racket-FK-relative (180 -> 175), plus absolute
# balance rewards/terminations. Tune reward weights, episode length, strike
# timing, target ranges, and motion clips here without changing the deploy-parity
# observation contract.
#
# The older `HOPEPingPongRealSensor` task name is kept as a backward-compatible
# alias that composes this file.
#
# Composes the shared env/sim/randomization bases (cfg/base/*) and overrides the
# HOPE-specific knobs below.
#
# ALIGNMENT GOAL (2026-06-26): reproduce HITTER, not invent our own curriculum.
# This file was stripped of the HOPE-invented machinery (motion_scale demotion,
# ref_perturb success-gated curriculum, ref_vel_scale clip down-scaling, 3-D
# target box, per-clip strike tuning) and set to HITTER's design:
#   * 10 s episode, multiple swings (resample target on each clip wrap)
#   * direct uniform target sampling at a FIXED strike plane x=0.4 m; sample
#     only (y, z) of racket position + the racket velocity vector (Table-/ §IV)
#   * NO curriculum: just sample + PPO
#   * imitation prior at natural weight (no motion_scale)
#   * DR: keep mass/friction/restitution + observation noise (HITTER prose),
#     PD gains FIXED (HITTER) -> pd_gain_range: null
# Reward weights/kernel widths are NOT published by HITTER, so they stay as
# reasonable HOPE choices (goal terms weighted relatively high, per the paper).
#
# STAGE NOTE (updated 2026-07-03): this IS the unified forehand+backhand config
# (registry_name_2 = backhand; swing type resampled per swing, per-clip boxes).
#
# AUDIT ALIGNMENT (2026-07-03): two structural additions from the HITTER/SMASH/
# Ace training-design audit, on top of the Phase-A multi-swing episode (10 s,
# no-teleport wraps, per-wrap target+swing-type resample, pre-swing hold):
#   * hold_ready reward — POSITIVE ready-stance signal for the legs/base during
#     the between-swing hold (HITTER's recovery is a positive "prepare for the
#     next target" signal, not penalties; ours previously covered only the
#     upper body via imitation of the frozen windup frame).
#   * achieved-target replay (racket.achieved_*) — on-policy HER: a fraction of
#     next-swing targets are drawn from previously-ACHIEVED strike states, so
#     the target distribution stops asking for points the taught swing never
#     passes through (kills the "learn the swing AND fight the box" conflict
#     without widening any box).
# =============================================================================

name: HOPEPingPongDeployParity
gym_task: HOPE-PingPong-DeployParity-AgibotA3-v0
experiment_name: agibot_a3_hope_deploy_parity
actor_obs_contract: deploy_parity

# Fresh-lineage plant control. This declared node makes Hydra reject a misspelled parent/leaf when
# callers use the documented override `task.plant.zero_joint_friction=true` (without `++`). False is
# byte-identical to the checked-in historical actuator config; true zeros all actuator groups before
# environment construction and is checked again against the instantiated 31-joint runtime contract.
plant:
  zero_joint_friction: false

# wandb motion registry clips. UNIFIED HITTER policy: clip 0 = forehand (registry_name), clip 1 =
# backhand (registry_name_2). MotionLoader concatenates them; clip_id selects which swing each env
# imitates. Order must match racket.strike_phase_per_clip. Set registry_name_2: null for a single-swing
# policy. (Override on the CLI with registry_name=... / registry_name_2=...)
#
# ⚠ GROUNDING (2026-07-03): registry :latest NOW = the RE-GROUNDED hopex lineage (frame-0 pelvis yaw
# exactly 0; uploaded+verified via scripts/upload_hopex_0703.py / verify_registry_latest_0703.py) —
# plain training picks it up automatically. HISTORY: the previous :latest was the RAW v4 clips
# (yaw +82/+86 deg, never re-grounded); training on them produced the turn-and-walk model_9000 that
# fell on deploy (perfect_tracking cannot see the footwork). If you ever re-upload clips, re-ground
# FIRST (scripts/reground_hope_frame.py) — MotionCommand warns loudly at startup when a loaded clip's
# frame-0 anchor yaw exceeds 10 deg, and upload_hopex_0703.py refuses to publish a raw clip.
registry_name: ${oc.env:WANDB_REGISTRY_ORG,dongc_1-university-of-california-berkeley-org}/wandb-registry-motions/hope_forehand
registry_name_2: ${oc.env:WANDB_REGISTRY_ORG,dongc_1-university-of-california-berkeley-org}/wandb-registry-motions/hope_backhand

defaults:
  - /base/env_base@_here_
  - /base/sim_base@_here_
  - /base/randomization_base@_here_
  - _self_

env:
  # HITTER: 10 s episode with multiple swings. With no ball the swings are independent; the target
  # resamples on each clip wrap, so a 10 s episode gives ~5 swings of practice and trains the
  # between-swing recovery. (Was capped to 3 s in the HOPE curriculum path; restored to HITTER.)
  # ARM A (2026-07-04 2-day retrain): 10 -> 16 s so the extended hold (hold_steps_range up to
  # 8 s) still leaves room for swing + recovery + a second hold inside one episode — at 10 s a
  # long-hold draw would truncate before the swing ever runs.
  episode_length_s: 16.0

# ---- swing-entry structure (MotionCommand) -----------------------------------
# Explicit defaults for the Phase-A multi-swing machinery (commands.py). Keys are optional: absent
# keys keep the code defaults. These are the knobs of the P2.1 A/B (baseline arm re-enables the
# teleport-entry era with wrap_teleport=true stand_start_prob=0.0).
motion:
  # Clip wrap during the episode does NOT teleport the robot: the policy must physically carry the
  # body from the previous swing's end into the next windup (deploy-honest recovery training).
  wrap_teleport: false
  # Fraction of TRUE episode resets that start from the default STAND (deploy entry, zero velocity)
  # instead of the legacy RSI teleport onto the reference windup frame.
  stand_start_prob: 0.25
  # Pre-swing hold: freeze the reference at the swing's first frame for a random number of control
  # steps ("the ball is not here yet"); stand-started envs hold at least stand_start_min_hold.
  # ARM A (2026-07-04): [0,100] -> [0,400]. 0-2 s holds are why the deployed hold margin is
  # ~5 s (Gate 2.5 P2 m0-hold falls at ~5 s; Gate 3 closed-loop tipped ~6 s after the return).
  # 0-8 s holds cover the demo serve cadence (4-6 s) with margin; acceptance = Gate 2.5 P2
  # 20 s hold PASS + mujoco_eval --df-hold-steps 1000.
  hold_steps_range: [0, 400]
  stand_start_min_hold: 25
  # A8 (Ace): fraction of TRUE resets initialized from the policy's OWN buffered end-of-swing
  # states (captured at clip wraps). Default OFF; enable per-experiment:
  #   task.motion.post_swing_start_prob=0.25
  # ARM A (2026-07-04): ON at 0.25 — episodes starting from the policy's OWN end-of-swing
  # (feet-staggered, post-lunge) states train precisely the stance that tipped the static
  # stand in the Gate 3 closed-loop. Mech-verified on main 2026-07-03 (P2.1 arm D).
  post_swing_start_prob: 0.25
  post_swing_buffer_size: 4096
  post_swing_min_fill: 256
  post_swing_min_hold: 25
  clip_switch_prob: 0.0        # deploy-parity mid-swing clip switch (venue falls fix; try 0.002)
  # P2.4/R14 retiming: per-swing reference playback speed U[lo,hi] (clock ×s, ref velocities ×s,
  # tts ÷s, target velocity ×s). [1.0, 1.0] = off; ablation trial [0.8, 1.2].
  speed_scale_range: [1.0, 1.0]

# ---- reward weights / kernel std --------------------------------------------
# HITTER does not publish reward weights or kernel forms. Goal terms get relatively high weight
# (paper). std brackets the operating error band (gradient), NOT the acceptance tolerance.
#
# REBALANCE 2026-06-27 (reward-share analysis on hitter_unified_v3): the strike objective
# (racket pos+vel+normal) was only ~8% of the positive reward while base_position alone was 45% and
# imitation ~47% — the optimizer barely "felt" the hit. Two fixes:
#   (a) WIDEN the dead velocity kernel: at strike the racket-velocity error is ~2 m/s, but std=0.8 gives
#       exp(-(2/0.8)^2)=exp(-6.25)~0.002 -> no gradient. Widen to 1.8 to BRACKET the ~2 m/s error
#       (exp(-1.2)~0.3, live), then curriculum-tighten 1.8->1.2->0.8->0.5 as the error falls. Same rule
#       widens position std a touch (0.15->0.20) for the 10-20 cm operating band.
#   (b) RAISE the racket weights (~1.7x) and TRIM base_position (4->2.5) so the hit is a real share of the
#       gradient. base still matters (HITTER's headline metric is base reach) — just no longer dominant.
# strike_window_s kept at 0.12 (widening it re-introduces swing-through timing dilution). All tunable.
rewards:
  racket_position_weight: 14.0     # 8 -> 14
  # std RE-TIGHTENED 0.20 -> 0.15 (2026-07-03, hopex re-grounded run 11-57-16): with correct
  # geometry the reference swing passes ~0.13 m from every sampled target, so at std 0.20 pure
  # imitation already collects exp(-(0.137/0.20)^2)=0.63 of the position reward — a lazy local
  # optimum where the policy strikes the BOX CENTER regardless of the sampled target (pos_err
  # plateaued at ~0.14-0.19 = the uniform-box sampling distance itself, pos_pass crawling +0.01/100
  # iters vs the v4 run's +0.05/100 breakout). Same disease as the ablation-1/2 saturation; same
  # cure: tighten the kernel to the operating band (0.137/0.15 -> kernel 0.43, live gradient).
  # Next levers if pos_pass still crawls after ~1k iters: hold_ready_weight 2.0 -> 1.0 (the
  # now-live stillness income suppresses footwork/approach vigor), then
  # racket.achieved_target_mix_prob 0.30 -> 0.15 (replayed targets cluster at the reference blade
  # point when the policy strikes in place, diluting conditioning pressure).
  racket_position_std: 0.15
  racket_velocity_weight: 10.0     # 6 -> 10
  racket_velocity_std: 1.0         # 1.8 -> 1.0 (curriculum tighten: vel_error fell to ~0.47, so 1.8 was
                                   # too lenient — exp(-(0.47/1.8)^2)=0.93, ~no gradient to improve. 1.0
                                   # sharpens the peak (exp(-(0.47/1.0)^2)=0.80) to push velocity lower.
                                   # Next: 1.0 -> 0.8 -> 0.5 as vel_error keeps dropping; never jump to 0.5.
  racket_normal_weight: 5.0        # 3 -> 5 (normal already satisfied ~0-2 deg; keep std 0.30)
  racket_normal_std: 0.30
  # BASE-FREE: base_position reward is REMOVED in the footwork cfg (HOPEDeployParityRewardsCfg sets it None).
  # Do NOT re-add base_position_weight/std here — _apply_task_overrides would fail (the term is gone).
  # The legs are driven by racket_progress instead. The footwork reward weights live in the cfg class.
  racket_position_static: false

  # Imitation prior at NATURAL weight (no motion_scale). HITTER does not demote the imitation reward
  # with a global scale; it relies on upper-body-only imitation + relatively-high goal weights +
  # multi-swing episodes to keep the swing dominant. (motion_scale removed in the HITTER alignment.)

  # Penalties / regularization (r_regularization).
  joint_torques_weight: -0.00003
  action_rate_weight: -0.10
  joint_limit_weight: -10.0
  undesired_contacts_weight: -0.1
  # Pre-strike foot-slip penalty (stability). Penalizes horizontal foot speed while the foot is in
  # contact, gated by pre_strike ONLY (the strike swing is untouched). Start small; raise if
  # foot_slip_speed stays high / foot_contact_frac stays low, lower if it starts hurting the strike.
  pre_strike_foot_slip_weight: -0.4
  # Anti twist-instead-of-step: penalize |waist_yaw|+|waist_roll| deviation from neutral BEFORE the strike
  # so the policy must STEP to face a lateral target instead of twisting the torso with planted feet.
  # Raise if the torso still twists (waist_twist_prestrike high / legs frozen); lower if it flattens the swing.
  prestrike_waist_twist_weight: -1.0
  # Torque-saturation penalty: mean over-limit fraction of the COMPUTED (pre-clip) effort over the arm +
  # waist joints. STALE CONTEXT NOTE (2026-07-03): this was added for the explicit clipped-PD deploy
  # theory; Phase A reverted ALL actuator groups to ImplicitActuatorCfg (robots/agibot_a3.py), and
  # implicit actuators do not fill computed_torque — so this term is likely INERT now (watch
  # arm_torque_sat_frac: if it is exactly 0 all run, the term is a no-op). Kept harmless.
  arm_torque_saturation_weight: -0.5
  # Between-swing recovery (2026-07-03 audit alignment): POSITIVE ready-stance reward during the
  # pre-swing HOLD — exp(-(|v_base|^2+|w_base|^2)/std^2) * feet_contact_frac, gated to motion.in_hold
  # AND to target-within-reach (racket_target_distance < hold_ready_reach). The reach gate keeps it from
  # out-earning racket_progress on far targets (planted stillness would otherwise pay ~1.5/step for NOT
  # stepping -> freeze-then-rush). The hold's imitation reward only covers the UPPER body (legs are
  # decoupled in the base-free design); this gives the legs/base their first positive "finish the swing
  # calm, planted, ready" signal.
  # RAISE if post_strike_fall_rate stays high with good strikes; LOWER if the robot freezes mid-approach;
  # keep hold_ready_reach roughly at comfortable arm reach (shrink it when the Phase 1-2 boxes widen if
  # the robot still refuses to step).
  # P2.4 (G08) PACE-style smooth deceleration — flag-gated, DEFAULT OFF. Pseudo base-velocity command
  # proportional to the remaining PLANAR racket->target error: v_des = clamp(v_gain*dist_xy, 0, v_max);
  # reward = exp(-(|v_base_xy| - v_des)^2 / std^2), gated to active pre_strike motion and OFF
  # during the frozen hold (hold_ready owns hold stillness). Far target -> pays for
  # moving at v_max (cooperates with racket_progress); as the strike stance is reached v_des -> 0 and
  # the term pays for a CALM base — a smooth taper instead of the violent reactive rush (deploy-parity
  # safe: REWARD-side only, the frozen 175-D actor obs contract is untouched). weight 0.0 = term OFF
  # (RewardManager skips zero-weight terms); trial arm: task.rewards.base_decel_weight=1.0.
  # Watch metric: base_speed_xy_prestrike. Keys MUST stay declared here — Hydra struct mode rejects
  # undeclared CLI overrides.
  base_decel_weight: 1.0    # ARM A (2026-07-04): ON — taper the lunge instead of the reactive
                            # rush; pairs with the extended hold (calm base when v_des -> 0).
                            # Watch base_speed_xy_prestrike.
  base_decel_v_gain: 2.0    # 1/s: slope of the pseudo velocity command per meter of planar error
  base_decel_v_max: 1.6     # m/s: desired-speed cap for far targets
  base_decel_std: 0.4       # m/s: kernel width around the desired speed
  # R16 (franco 2026-07-04): free the racket-side wrist from ORIENTATION mimic — drop
  # right_wrist_yaw_Link from the motion_body_ori / motion_body_ang_vel body lists (position and
  # linear-velocity mimic keep the swing path). Rationale: the video pipeline's wrist orientation
  # is unreliable (GVHMR), so mimicking it caps face quality; freed, the face is shaped only by
  # the racket_normal reward (and by the commanded normal at contract v3). Default off.
  free_wrist_ori_mimic: false
  hold_ready_weight: 2.0
  # std RETUNED 0.5 -> 1.5 (2026-07-03): the 2026-07-03_02-01-17 run showed hold_ready ~inert
  # (Episode_Reward ~0.013/s, ~1/100 of expected) because real base |omega| during the hold is
  # ~1.2 rad/s -> exp(-1.5/0.25) ~ 0.002 dead kernel. 1.5 brackets the operating band
  # (exp(-2/2.25) ~ 0.41, live gradient) — same lesson as the racket velocity std saga.
  hold_ready_std: 1.5
  hold_ready_reach: 0.65
  # Pre-strike upright shaping (POSITION-based tilt, NOT ang-vel): keep the CoM over the support base
  # THROUGH the approach (strike_upright already covers the strike window). RAISE if the base pitches
  # forward during the wind-up; LOWER if it stiffens the swing.
  prestrike_upright_weight: -1.0
  # 脚部姿态惩罚(人话:不许拧着脚打球——髋偏航/髋侧滚/踝侧滚要贴着参考动作走)。
  # jiayi hold-fall stack 2026-07-05: without it these reward-free DOF twisted to -1.13/+0.90 rad
  # vs a ±0.41 reference envelope ("weird foot placement" at strike/switch). Cfg default is 0.0
  # (merge-audit flag-off); THIS lineage trained with -0.3, so it is pinned here. Tune window
  # per jiayi: [-0.5, -0.1]. UN-ABLATED — queued as an A/B arm.
  foot_orientation_weight: -0.3

# ---- deploy-faithful action processing ---------------------------------------
actions:
  # q_des 限位剪切(人话:训练时就把"超出关节物理范围的目标角"剪掉,和真机跑步机一样——
  # 不许策略靠"喊超范围的角度"来多要力矩)。jiayi hold-fall stack 2026-07-05 (f8c166e):
  # this lineage's holdfix models trained WITH the clamp and passed all three gates on the
  # TRUE plant. Cfg default is false (merge-audit flag-off; clean-train path provable);
  # pinned true here to keep this lineage's recipe reproducible from YAML alone.
  qdes_clamp: true

# ---- racket target sampling (HITTER: direct, fixed plane, no curriculum) -----
racket:
  # 训练内上台率曲线(人话:每次击球后拿虚拟球算一遍"过网+落对面台内"的比例,只记分不发奖励)。
  # franco 2026-07-06: 训练主看 virtual_return_rate(上台率),辅看 virtual_hit_rate(击球率);
  # 正式入账仍以 MuJoCo 考卷为准。Metrics only — no reward terms read the vb caches on this task.
  vb_metrics_only: true
  # P2.3 SMASH-style adaptive tracking sigma: when true, racket_position/racket_velocity stds (and
  # racket_strike_success std_pos/std_vel) auto-tighten to clamp(mean exact-strike error, min, max)
  # every sigma_update_every steps — replaces the hand-run 1.8->1.0->0.8->0.5 std curriculum.
  # Default OFF; enable per-experiment: task.racket.adaptive_sigma=true
  # (maxima match this file's starting stds; minima are the acceptance thresholds)
  adaptive_sigma: false
  sigma_update_every: 500
  sigma_ema_scale: 1.0
  sigma_pos_min: 0.075
  sigma_pos_max: 0.20
  sigma_vel_min: 0.5
  sigma_vel_max: 1.0

  # ---- A1 target latency & time-variance (mocap->planner->runner realism) --------------------
  # Training otherwise hands the actor a PERFECT, instantly-updated target; the real loop delivers
  # it LATE (transport + planning latency), NOISY (ball-prediction error that shrinks as the strike
  # approaches — SMASH Eq. 14 tts-decaying noise), and REFINED mid-swing (the planner re-plans
  # WHERE, not WHEN — PACE injects sensor delays for the same reason). Only the ACTOR-visible
  # target view (pos/vel/face-command/swing_sign) is degraded atomically: rewards, metrics, and the privileged critic
  # always use the true live target, and time_to_strike is never delayed (the swing clock is
  # generated robot-side by the runner, not by the mocap link).
  # ALL OFF by default (byte-identical baseline). Enable per-experiment, e.g.:
  #   task.racket.target_delay_steps=2 task.racket.target_jitter_pos_per_s=0.05 \
  #   task.racket.midswing_resample_prob=0.02
  # Watch: metrics target_delay_steps_in_effect (constant) + midswing_resample_count (per-step
  # refinement fraction, ~ prob * eligible fraction).
  target_delay_steps: 0            # 50 Hz steps the actor sees the atomic target message late
  target_jitter_pos_per_s: 0.0     # m: actor target pos noise std at tts>=1 s, decays ~ clamp(tts,0,1)
  target_noise_white: 0.0          # m: calibrated mocap white noise (venue fit: 0.0019); no tts decay
  target_noise_ar1_sigma: 0.0      # m: calibrated AR(1) colored noise marginal std (venue fit: 0.0052)
  target_noise_ar1_rho: 0.717      # per 50 Hz step (= venue 0.946/frame @300 Hz ^6)
  target_dropout_prob: 0.0         # A1v2: per-step frame loss -> actor holds last target value
  target_post_strike_dropout_s: 0.0  # A1v2: forced hold-last right after each strike (s; venue ~0.03)
  target_bias_per_swing: 0.0       # A1v2: constant per-swing bias std (m), resampled at strike
  target_jitter_vel_per_s: 0.0     # m/s: same decay law for the target velocity
  midswing_resample_prob: 0.0      # per-step prob of re-drawing WHERE mid-swing (strike timing untouched)
  midswing_resample_tts_floor: 0.3 # s: no refinement inside the last 0.3 s before the strike

  # Strike timing: phase of the clip at which contact happens (racket-BLADE speed peak).
  # WRIST -> BLADE RE-PLANE (2026-07-02): the phases/boxes below were previously planned on the bare
  # WRIST body point (npz body 31 = right_wrist_yaw_Link), but the strike metric (RacketTargetCommand,
  # wrist_offset FK mode) measures the BLADE = wrist * T_mount, mount_offset (0.21021, 0.032078,
  # 0.032036) m, identity mount_quat. Re-detected on the BLADE with scripts/analyze_strike_phase.py
  # (now blade-default; --wrist-point restores the old behavior) on the re-grounded _hopex clips:
  #   forehand frame 65/139 = phase 0.468, blade |v| 2.69 m/s (wrist analysis picked the same frame).
  #   backhand frame 44/132 = phase 0.333, blade |v| 3.02 m/s. NOTE: yaml 0.33 rounded to frame 43
  #     (round(0.33*131)=43); 0.333 rounds to the true blade-speed-peak frame 44.
  strike_phase: 0.47              # fallback (single-clip / clips not in the per-clip table)
  # Unified policy: per-clip strike phase, aligned with the clip order (clip0=forehand, clip1=backhand).
  # Each phase must land on the FORWARD contact (blade speed peak on the forward swing), not a recovery frame.
  #   forehand: 0.47  -> blade speed peak frame 65/139 (blade re-detect 2026-07-02; unchanged from wrist).
  #   backhand: 0.333 -> blade speed peak frame 44/132 (was 0.33 -> frame 43, one frame early on the blade).
  #     (v1 was 0.36/0.50; v2 clips are longer. v2 was mis-grounded facing world +Y (~82-86deg); it is now
  #     RE-GROUNDED to face +X (HOPE frame) via scripts/reground_hope_frame.py, so the boxes below are +X-frame.)
  strike_phase_per_clip: [0.47, 0.333]
  strike_window_s: 0.12
  strike_success_pos_thresh: 0.075
  debug_reward_logging: false

  # Recompute the strike-target velocity from racket-FK position by a centered finite difference
  # (denoises the FD'd stored body_lin_vel). Kept — it is a data-quality fix, not a HITTER divergence.
  clean_reference_strike_velocity: true
  clean_strike_vel_window: 2

  # HITTER target sampling: uniform, directly sampled, NO reference-perturb curriculum.
  target_mode: uniform

  # ---- HER-style achieved-target replay (2026-07-03 audit alignment) -------------------------
  # On-policy hindsight relabeling (Ace/HER, forward-looking): with prob achieved_target_mix_prob the
  # next swing's target (pos+vel) is a jittered PREVIOUSLY-ACHIEVED strike state from that clip's ring
  # buffer (filled at exact-strike frames of alive envs) instead of a fresh box sample. Replayed targets
  # are reachable-by-demonstration, clamped into the per-clip box inflated by achieved_clamp_inflate so
  # the distribution can neither collapse onto current behaviour nor leave the training workspace.
  # DEPLOY SYNC WARNING (2026-07-03): the deploy-side target clips (pp_policy.hpp racket_pos/vel_w_clip,
  # hope_planner imitate_presets SafetyLimits) are NOT in sync with the boxes below — they still encode
  # the pre-re-plane lineage (x<=0.50 vs our x>=0.56). They MUST be re-synced before deploying any model
  # trained on this config, or planner targets will sit 6-28 cm outside the training support. The target
  # NORMAL stays the per-clip reference normal on both paths. Watch: achieved_replay_frac (should sit
  # near the mix prob once achieved_buffer_fill_* passes achieved_min_fill). Set mix prob 0.0 to disable
  # (pure HITTER box sampling). Raise toward 0.5 if strike_pos_pass stalls with the box targets;
  # lower if the target distribution gets too narrow (racket_target_speed_at_strike variance shrinking).
  achieved_target_mix_prob: 0.30
  achieved_buffer_size: 4096
  achieved_min_fill: 256
  achieved_jitter_pos: 0.03    # m, per-axis uniform jitter on a replayed position
  achieved_jitter_vel: 0.15    # m/s, per-axis uniform jitter on a replayed velocity
  achieved_clamp_inflate: 0.20 # clamp replay into the per-clip box inflated by 20%

  # ====================== FOOTWORK CURRICULUM (base-free) ======================================
  # Train in PHASES, widening the racket-target range so the dense racket_progress reward forces more
  # body/leg contribution as arm-only reach runs out. Warm-start each phase from the previous checkpoint
  # (checkpoint_path=...). Override the ranges per phase on the Hydra CLI (no extra yaml needed), e.g.:
  #
  #   PHASE 0 (this file's defaults): small range -> learn a STABLE strike, legs barely need to move.
  #   PHASE 1: widen laterally + vertically -> progress reward starts needing body/leg shift. CLI:
  #     racket.racket_pos_y_abs_range=[0.05,0.30] racket.pos_z_range=[0.75,1.05] \
  #     'racket.pos_range_per_clip.forehand.y=[-0.35,-0.12]' 'racket.pos_range_per_clip.forehand.z=[0.78,1.00]' \
  #     'racket.pos_range_per_clip.backhand.y=[0.12,0.35]'  'racket.pos_range_per_clip.backhand.z=[1.00,1.25]'
  #   PHASE 2: full range + varied time_to_strike -> arm-only reach is insufficient, policy must STEP/shift:
  #     racket.racket_pos_y_abs_range=[0.05,0.45] racket.pos_z_range=[0.70,1.05] \
  #     'racket.pos_range_per_clip.forehand.y=[-0.45,-0.20]' 'racket.pos_range_per_clip.backhand.y=[0.20,0.45]'
  # =============================================================================================
  # Fixed striking plane at x = 0.4 m in front of the robot (HITTER §IV).
  pos_x_range: [0.40, 0.40]
  # PHASE 0 ranges (narrow — a stable strike near the reference; widen per the curriculum above).
  racket_pos_y_abs_range: [0.05, 0.15]
  pos_y_range: [-0.15, -0.05]
  pos_z_range: [0.82, 0.94]
  # Per-clip target box, in the HOPE WORLD frame (racket_target = env_origin + motion.body_pos_w[strike]).
  # RE-GROUNDED 2026-07-01: the v2 clips were mis-grounded facing world +Y (~82-86deg) = table WIDTH, so their
  # return velocity pointed +Y (lateral) — wrong for the HOPE table (geometry.py: +X = length / toward the
  # opponent, Y = width, robot faces +X). scripts/reground_hope_frame.py rotates each clip about +Z by
  # -(frame-0 pelvis yaw) so the robot stands facing +X and the return velocity is +X-dominant. Corrected
  # clips: artifacts/hope_{forehand,backhand}_hopex/motion.npz (upload as hope_* v3 before training).
  #
  # WRIST -> BLADE RE-PLANE (2026-07-02): the old boxes were centered on the WRIST body at strike
  # (fore (0.48,-0.38,0.87) / back (0.52,-0.04,1.05)) — but the strike metric measures the BLADE
  # (wrist + R(wrist)@mount_offset, offset 0.215 m), so those targets sat 0.09-0.20 m short of true
  # blade contact. Re-centered on the BLADE-at-strike from analyze_strike_phase.py (blade default):
  #   forehand @ phase 0.47  (frame 65):  blade pos (0.68, -0.44, 0.82)
  #   backhand @ phase 0.333 (frame 44):  blade pos (0.66,  0.13, 1.03)
  # PHASE-A STABILITY spans: pos +-(0.10, 0.20, 0.10) m per axis — conservative ON PURPOSE (learn a
  # stable strike at the reference blade point first; the wide footwork boxes come in later phases).
  # +X=forward, -Y=forehand(right) side. Sanity: z >= 0.60, x <= 0.85 everywhere.
  pos_range_per_clip:
    forehand: {x: [0.58, 0.78], y: [-0.64, -0.24], z: [0.72, 0.92]}
    backhand: {x: [0.56, 0.76], y: [-0.07,  0.33], z: [0.93, 1.13]}
  # Racket target VELOCITY (HOPE world frame): return is +X-dominant (toward the opponent). BLADE
  # RE-PLANE 2026-07-02: old boxes were centered on the WRIST strike velocity (fore (+1.54,+1.17,+0.64) /
  # back (+1.79,-0.46,+0.15)), 0.5-0.9 m/s slower than the blade (omega x r term). Re-centered on the
  # BLADE clean strike velocity (+-2-frame centered FD of blade FK pos = training's
  # clean_reference_strike_velocity parity): fore (+1.55,+1.46,+0.71) / back (+2.11,-0.71,+0.31).
  # Spans +-(0.5, 0.5, 0.4) m/s; backhand z lower bound clamped to 0.0 (old box was >= 0).
  # X dominates both; the forehand keeps a real +Y cross-court lateral, the backhand a -Y component.
  vel_range_per_clip:
    forehand: {x: [1.05, 2.05], y: [ 0.96, 1.96], z: [0.31, 1.11]}
    backhand: {x: [1.61, 2.61], y: [-1.21, -0.21], z: [0.00, 0.71]}
  # Shared fallback velocity box (used only for single-clip runs / clips without a per-clip entry).
  vel_x_range: [1.5, 3.5]
  vel_y_range: [-1.0, 1.0]
  vel_z_range: [0.0, 1.5]

  # BASE-FREE: base-target sampling/coupling is unused (base_position reward + base_target obs removed).
  # Keep the jitter ranges harmless and DISABLE the base->racket coupling so nothing nudges a base target.
  base_target_x_range: [-0.10, 0.10]
  base_target_y_range: [-0.10, 0.10]
  base_couple_blend: 0.0
  base_couple_max_offset: 0.20
  # normal_mode is the SINGLE-CLIP normal target rule ("velocity" = n=v/|v|, or "sampled"). NOTE: in the
  # UNIFIED multi-clip policy it is IGNORED — the target normal is the per-clip reference paddle normal
  # (hope_commands.py `_ensure_ref_normal_per_clip` / `_sample_targets_uniform` multiseg branch), because
  # the +Y blade face is 18-110 deg off the swing-velocity direction. Only used if registry_name_2: null.
  normal_mode: velocity
  forehand_on_negative_y: true    # right arm holds the paddle
  mount_normal_axis: 1            # racket-local +Y is the face normal (red/hitting face; Step 11)
  mount_normal_sign: 1.0          # +1 = red/forehand face

# ---- domain randomization (HITTER-faithful + sim2real fine-tune) -------------
# HITTER publishes no DR table; prose randomizes mass/friction/restitution + perception noise, and
# states PD gains are FIXED. Always-on (base EventCfg): friction (static 0.3-1.6 / dynamic 0.3-1.2 /
# restitution 0-0.5), torso CoM jitter, joint-default-pos jitter, + link-mass below. External push is
# dropped (HOPEEventCfg.push_robot=None).
#
# SIM2REAL FINE-TUNE (2026-07-02): PD-gain randomization at +/-15% keeps the policy robust to the
# sim<->deploy PD mismatch (departs from HITTER's fixed-PD stance ON PURPOSE, for transfer).
# CONTEXT UPDATE (2026-07-03): Phase A reverted ALL actuator groups to ImplicitActuatorCfg
# (robots/agibot_a3.py — AGI's real backend behaves like implicit PD), so the old rationale text about
# IdealPDActuator/explicit clipped-PD is stale; randomize_actuator_gains still applies to implicit
# actuators (PhysX drive gains), so the randomization itself remains live. Link mass +/-15%.
domain_rand:
  link_mass_range: [0.85, 1.15]   # +/-15%
  pd_gain_range: [0.85, 1.15]     # +/-15% (was null); perturbs the explicit IdealPDActuator gains
