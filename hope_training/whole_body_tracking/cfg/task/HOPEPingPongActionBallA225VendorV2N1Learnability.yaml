# Fresh-only fixed-question A225 four-arm diagnostic.
#
# This profile starts from VendorV2 rather than the historical fixed-194 N1
# profile.  Its actor consumes a complete task-derived desired-contact tuple and
# its new privileged critic has an independent ABI/normalizer/checkpoint lineage.
defaults:
  - HOPEPingPongActionBallA3VendorV2@_here_
  - _self_

name: HOPEPingPongActionBallA225VendorV2N1Learnability
gym_task: HOPE-PingPong-ActionBall-A225Learnability-AgibotA3-v0
actor_obs_contract: action_ball_a225

# Local fixed-question diagnostic only.  The selected-rubber PhysX outcome
# bridge is not canonical yet, so no physics/deployment authorization follows.
physical_ball: false

motion:
  action_ball_diagnostic_split_ready_teacher: true

actions:
  # All first-wave arms are delay-matched at zero.  A delay/history study is a
  # separate ABI and cannot enter only one reward/PPO arm.
  control_step_action_delay_min: 0
  control_step_action_delay_max: 0

push:
  # Drop VendorV2's enabled axis-box payload as one Hydra node.  Keeping its
  # amplitudes underneath enable=false is intentionally rejected by train.py.
  _delete_: true
  enable: false

racket:
  virtual_ball: true
  vb_metrics_only: false
  action_ball_pool_refill_rows: 1

  # A versioned immutable A225 tape owns one complete desired p/v/face tuple.
  # No L194 validity-mask recipe is exposed as an arm axis; the A225 producer
  # itself rejects any incomplete component tuple.
  action_ball_target_source: immutable_tape
  action_ball_immutable_tape_path: ""
  action_ball_immutable_tape_sha256: ""
  action_ball_target_observation_noise: false
  adaptive_sigma: false
  adaptive_sigma_monotonic: false
  adaptive_sigma_normal: false
  target_noise_white: 0.0
  target_noise_ar1_sigma: 0.0
