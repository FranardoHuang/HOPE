# Immutable next-generation ActionBall task profile backed by the latest Agibot A3 training
# authority.  This leaf is intentionally separate from HOPEPingPongActionBall so the vendor DR and
# push recipe has a distinct launch-claim/training-contract SHA.  The robot articulation constants
# themselves are process-global, however: a current-source legacy N1 launcher must therefore refuse
# to run instead of creating an old experiment name on this new plant.

defaults:
  - HOPEPingPongActionBall@_here_
  - _self_

name: HOPEPingPongActionBallA3VendorV1

rewards:
  # Bang-bang policy: retain the clamped first-difference action-rate term from reward_pack=v2,
  # but explicitly defeat its raw-action second-difference penalty.  This is engine-independent
  # scientific identity and must remain zero in both Isaac and MuJoCo training.
  action_acc_weight: 0.0
  # 2026-07-31 4096x5 probe: 97/100 strike-window entry samples were farther than 0.20 m
  # (mean 0.4339 m), where the retained 0.075 m precision kernel is effectively silent.
  # This lower-paid 0.30 m companion ranks those misses without moving the precision optimum.
  racket_position_coarse_weight: 1.0
  racket_position_coarse_std: 0.30

actions:
  # One lag is sampled per environment at episode reset and held fixed for the whole episode.
  # Units are policy/control steps (20 ms each at the current 50 Hz policy), never physics substeps.
  control_step_action_delay_min: 0
  control_step_action_delay_max: 2
  # Emergency containment only: once live q/qdot predicts a physical-edge crossing, command the
  # opposite executable endpoint until velocity turns inward and clearance is recovered.  This
  # does not constrain nominal actor acceleration, change PPO actions, or add a smoothness reward.
  pre_apply_guard_brake_mode: max_inward_until_nonoutward_v1
  # Same-platform vendor plant probe: intervene at six percent of physical joint travel.  This
  # moves only the live q/qdot guard trigger; the executable soft projection, raw hard limits and
  # mechanical-edge DoneTerms remain owned by the unchanged ActionBall plant/runtime contract.
  pre_apply_guard_margin_fraction: 0.06
  # Dual position envelope: PhysX enforces H_ctrl two percent inside URDF H_mech on waist roll,
  # waist pitch, and both ankle-roll joints; the other 27 axes and the raw actual-hard/terminal
  # ledger retain H_mech.  The nominal 0.9 soft envelope, finite q_des projection, actor action,
  # delay, and rewards are unchanged.
  physx_control_position_limit_inset_fraction: 0.02

push:
  enable: true
  recipe: axis_box_6d_v2
  # ActionBall keeps the already-probed Wave-P/PACE cadence.  The A3 parkour 1-3 s cadence is not
  # copied into the strike window; only its same-platform six-axis amplitudes are adopted here.
  interval_range_s: [5.0, 15.0]
  velocity_range:
    x: [-0.25, 0.25]
    y: [-0.25, 0.25]
    z: [-0.1, 0.1]
    roll: [-0.26, 0.26]
    pitch: [-0.26, 0.26]
    yaw: [-0.39, 0.39]
