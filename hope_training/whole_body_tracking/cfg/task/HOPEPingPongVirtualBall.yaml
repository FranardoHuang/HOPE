# =============================================================================
# HOPE ping-pong WBC — deploy-parity obs + Tier-1 VIRTUAL-BALL rewards.
#
# Selected with `task=HOPEPingPongVirtualBall`. Composes the deploy-parity task
# (same 175-D actor contract, same racket/DR/motion tuning) and only swaps the
# gym task to the variant whose reward stack adds the virtual-ball outcome terms
# (virtual_pass_net 20 / virtual_landing 30 / virtual_spin 5). Historical P2/o2/o3 runs
# accidentally resolved the inherited DeployParity values 14/10/5 even though the class and
# Tier-1 design specify outcome-dominant 4/0.5/0.5 shaping.  This task now pins the intended
# values explicitly.  Reproduce a historical run from its saved Hydra env.yaml or explicit CLI
# overrides; do not silently make new runs inherit that old mismatch. See rewardDesign.md
# (Tier 1) and RacketTargetCommandCfg.vb_* for the sampling boxes / gates.
# =============================================================================

defaults:
  - HOPEPingPongDeployParity@_here_
  - _self_

name: HOPEPingPongVirtualBall
gym_task: HOPE-PingPong-VirtualBall-AgibotA3-v0
experiment_name: agibot_a3_hope_virtualball
actor_obs_contract: deploy_parity

racket:
  # virtual_spin semantics: "topspin" (Ace ws-term, generates ball quality) or "minimize"
  # (stage-1 placement-first: cancel incoming spin; see RacketTargetCommandCfg.vb_spin_mode).
  vb_spin_mode: topspin
  vb_spin_min_sigma: 10.0
  # Virtual incoming-ball sampling boxes — explicit here so Hydra CLI overrides work (struct
  # mode). Defaults = the hand-set boxes; the venue-fitted alternatives live in
  # configs/incoming_ball_venue.yaml (training = vb_boxes_training_rebalanced).
  vb_vel_x_range: [-4.5, -2.0]
  vb_vel_y_range: [-0.6, 0.6]
  vb_vel_z_range: [-1.0, 0.5]
  vb_spin_abs_max: 50.0

# ---- EXPLICIT RESOLVED CONTRACT (2026-07-10 audit) -------------------------------------------
# The composed base (HOPEPingPongDeployParity.yaml) carries jiayi's ARM A retrain values
# (16 s episodes, 0-8 s holds, post_swing 0.25, base_decel ON, position std 0.15 — see the
# ARM A comments there). P2/o2/o3 historically resolved tracking weights 14/10/5; their saved
# run configs remain the provenance for those results. New task composition explicitly restores
# the Tier-1 class/design weights below. Arm launchers still pass recipe flags (for example
# post_swing_start_prob) explicitly, so this YAML keeps those structural flags off by default.
env:
  episode_length_s: 10.0
motion:
  hold_steps_range: [0, 100]
  post_swing_start_prob: 0.0
rewards:
  # Tier-1 contract, repeated from HOPEVirtualBallRewardsCfg so Hydra composition cannot replace
  # it with DeployParity's tracking-heavy 14/10/5. The virtual outcome terms own shot quality;
  # these three terms provide approach/vector shaping only.
  racket_position_weight: 4.0
  racket_position_std: 0.075
  racket_velocity_weight: 0.5
  racket_velocity_std: 0.5
  racket_normal_weight: 0.5
  racket_normal_std: 0.262
  base_decel_weight: 0.0
  # Keep the Tier-1 design default. DeployParity's -0.3 was a separate, unablated hold/fall arm;
  # inheriting it here silently confounded every VirtualBall result after task composition.
  foot_orientation_weight: 0.0

actions:
  # q_des 限位剪切(人话:训练时就把超关节范围的目标角剪掉,和真机一致)。franco 2026-07-06
  # 定死默认开:jiayi 发现不剪切的产品线在 MuJoCo 门禁里根本站不起来(平衡策略靠"喊超范围
  # 角度"多要力矩,真机/门禁不给)。此处显式钉住,防未来默认漂移;关闭仅限老配方复现对照臂。
  qdes_clamp: true
