# =============================================================================
# HAND-ALIGNED STRIKE (ball-contact) ANNOTATIONS - the only trusted source of
# strike_phase for reference clips.
#
# WHY THIS FILE EXISTS (two video-pipeline failure modes, found 2026-07-04/05):
#   1. STRIKE TIME: the auto detector (analyze_strike_phase.py) picks the racket
#      speed peak on the forward swing. On real-play video the speed peak is
#      routinely the POST-CONTACT WHIP or the PULL-UP, not the contact - v5
#      forehand read 0.768 when true contact is ~0.673 (franco, frame-by-frame,
#      2026-07-04). Speed peak != contact. Auto values are candidates only;
#      every clip must be hand-aligned and recorded here.
#   2. FACE NORMAL: the paddle face is not observable in the videos; the
#      "face normal" of a video-derived (GVHMR) clip is just the wrist +Y frame
#      - a wrist-direction proxy, NOT the blade orientation. Mark such clips
#      face_normal_reliable: false and never quote their strike-frame normal as
#      a physical face direction. Mocap-retargeted clips with a rigid mount are
#      the safer source for face-normal work.
#
# Consumers:
#   - scripts/analyze_strike_phase.py --annotations (default: this file). An
#     annotated phase OVERRIDES the auto pick; a large disagreement prints the
#     known-trap warning. Unannotated clips are reported as UNVERIFIED.
#   - humans: the phase values here are what goes into an explicit training
#     override such as `task.racket.strike_phase_per_clip=[fh,bh]`.
#
# Key = motion-file stem (hope_forehand_v5.npz -> hope_forehand_v5); for
# artifacts/<name>:vN/motion.npz use the parent directory name (hope_forehand:v1).
#
# status: verified   = a human scrubbed the source video / npz frames to contact
#         unverified = value in use but produced by the speed-peak auto detector
#                      (KNOWN TRAP) - needs hand alignment
#
# train_phase_candidates (OPTIONAL, independent field, 2026-07-05): TRAINING-optimal
# phases from the returnability scan (gen_stage1_questions.py --phase-scan) — which
# frame's kinematics best suit ROBOT returns. Semantically different from `phase`
# (VIDEO truth: when the human touched the ball); the two may legitimately differ.
# The scan never writes this file — a human copies suggestions here. Consumers:
# stage-1 arm configs pick their anchor frame from these, NEVER from `phase` blindly.
# =============================================================================

# =============================================================================
# GRIP CALIBRATION (2026-07-06, solved): the pipeline cannot SEE the paddle, so
# the blade orientation was INFERRED from the rally prior — "a standard
# cross-court rally must return legally at the hand-annotated contact frames":
#
#   blade_normal_world = R_wrist_world @ ( Rz(alpha_z) @ Rx(beta_x) @ y_hat )
#
# Joint solve on v5 fh+bh (shared grip, per-clip rally direction psi), BLADE-
# point kinematics (analyze_strike_phase use_blade=True), venue topspin balls:
#   alpha_z = +5 deg, beta_x = +40 deg  (wrist-local blade dir ~ [-0.07,0.76,0.64])
# Validation: v5 fh/bh BOTH 100% returnable at their annotated frames
# (psi +40/-40); ZERO-SHOT transfer to the oblique session: both 100%
# (psi +55/-60); hopex dry swings become returnable exactly around their
# conventional phases (fh 0.46-0.49, bh 0.32-0.35). ALL SIX clips rescued by one
# constant -> every earlier "this motion cannot return" verdict was the
# unobserved grip angle + rally direction, not the motion.
# NOTE the ROBOT's blade stays strictly perpendicular to wrist+Y (hardware STL
# fact): consumers must either bake this grip rotation into retargeting (wrist
# pose corrected so the robot blade matches the human BLADE) or keep the raw
# prior and rely on the face-command channel. Decision pending franco.
#
# rally_yaw_deg (per clip below): the solved rally diagonal. REGISTRY CONVENTION
# (franco 2026-07-06): anchors are designed in the STRAIGHT-HIT frame — rotate
# the clip/questions by -rally_yaw_deg to canonicalize, rotate targets to aim
# anywhere. The motion is general; the diagonal is just how it was filmed.
# =============================================================================
