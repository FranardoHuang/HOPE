# =============================================================================
# HAND-ALIGNED STRIKE (ball-contact) ANNOTATIONS - the only trusted source of
# strike_phase for reference clips.
#
# WHY THIS FILE EXISTS (two video-pipeline failure modes, found 2026-07-04/05):
#   1. STRIKE TIME: the auto detector (analyze_strike_phase.py) picks the racket
#      speed peak on the forward swing. On real-play video the speed peak is
#      routinely the POST-CONTACT WHIP or the PULL-UP, not the contact - v5
#      forehand read 0.768 when true contact is ~0.673 (franco, frame-by-frame,
#      2026-07-04). Speed peak != contact. Auto values are candidates only;
#      every clip must be hand-aligned and recorded here.
#   2. FACE NORMAL: the paddle face is not observable in the videos; the
#      "face normal" of a video-derived (GVHMR) clip is just the wrist +Y frame
#      - a wrist-direction proxy, NOT the blade orientation. Mark such clips
#      face_normal_reliable: false and never quote their strike-frame normal as
#      a physical face direction. Mocap-retargeted clips with a rigid mount are
#      the safer source for face-normal work.
#
# Consumers:
#   - scripts/analyze_strike_phase.py --annotations (default: this file). An
#     annotated phase OVERRIDES the auto pick; a large disagreement prints the
#     known-trap warning. Unannotated clips are reported as UNVERIFIED.
#   - humans: the phase values here are what goes into an explicit training
#     override such as `task.racket.strike_phase_per_clip=[fh,bh]`.
#
# Key = motion-file stem (hope_forehand_v5.npz -> hope_forehand_v5); for
# artifacts/<name>:vN/motion.npz use the parent directory name (hope_forehand:v1).
#
# status: verified   = a human scrubbed the source video / npz frames to contact
#         unverified = value in use but produced by the speed-peak auto detector
#                      (KNOWN TRAP) - needs hand alignment
#
# train_phase_candidates (OPTIONAL, independent field, 2026-07-05): TRAINING-optimal
# phases from the returnability scan (gen_stage1_questions.py --phase-scan) — which
# frame's kinematics best suit ROBOT returns. Semantically different from `phase`
# (VIDEO truth: when the human touched the ball); the two may legitimately differ.
# The scan never writes this file — a human copies suggestions here. Consumers:
# stage-1 arm configs pick their anchor frame from these, NEVER from `phase` blindly.
# =============================================================================

# =============================================================================
# GRIP CALIBRATION (2026-07-06, solved): the pipeline cannot SEE the paddle, so
# the blade orientation was INFERRED from the rally prior — "a standard
# cross-court rally must return legally at the hand-annotated contact frames":
#
#   blade_normal_world = R_wrist_world @ ( Rz(alpha_z) @ Rx(beta_x) @ y_hat )
#
# Joint solve on v5 fh+bh (shared grip, per-clip rally direction psi), BLADE-
# point kinematics (analyze_strike_phase use_blade=True), venue topspin balls:
#   alpha_z = +5 deg, beta_x = +40 deg  (wrist-local blade dir ~ [-0.07,0.76,0.64])
# Validation: v5 fh/bh BOTH 100% returnable at their annotated frames
# (psi +40/-40); ZERO-SHOT transfer to the oblique session: both 100%
# (psi +55/-60); hopex dry swings become returnable exactly around their
# conventional phases (fh 0.46-0.49, bh 0.32-0.35). ALL SIX clips rescued by one
# constant -> every earlier "this motion cannot return" verdict was the
# unobserved grip angle + rally direction, not the motion.
# NOTE the ROBOT's blade stays strictly perpendicular to wrist+Y (hardware STL
# fact): consumers must either bake this grip rotation into retargeting (wrist
# pose corrected so the robot blade matches the human BLADE) or keep the raw
# prior and rely on the face-command channel. Decision pending franco.
#
# rally_yaw_deg (per clip below): the solved rally diagonal. REGISTRY CONVENTION
# (franco 2026-07-06): anchors are designed in the STRAIGHT-HIT frame — rotate
# the clip/questions by -rally_yaw_deg to canonicalize, rotate targets to aim
# anywhere. The motion is general; the diagonal is just how it was filmed.
# =============================================================================
grip:
  session_v5_oblique_hopex:
    alpha_z_deg: 5
    beta_x_deg: 40
    solved_from: v5 rally prior (2026-07-06); zero-shot transfer to oblique+hopex
    solver: solve_grip_blade.py (scratch) -> productize into gen_stage1_questions --grip

clips:
  # --- v5 real-play clips (GVHMR video source) --------------------------------
  hope_forehand_v5:
    phase: 0.673
    status: verified
    annotator: franco
    date: 2026-07-04
    method: frame-by-frame scrub; detector's 0.768 identified as post-contact whip
    source: video-gvhmr
    face_normal_reliable: false
    notes: strike-frame normal (+0.47,+0.84,-0.27) is wrist-proxy only
    rally_yaw_deg: 40   # calibrated (topspin, 100% at the annotated frame)

  hope_backhand_v5:
    phase: 0.362
    status: verified
    annotator: claude (visual frame scrub, raw_video_v5/backhand_v5.mp4)
    date: 2026-07-05
    method: ball contacts blade at video f014 (t=0.433s); start-aligned video->npz
      mapping -> frame 21 +-1 of 58. Previous auto 0.345 (frame 20) was 1-2 frames
      early (pre-contact approach); within franco's "first 3/7" prior either way
    source: video-gvhmr
    face_normal_reliable: false
    train_phase_candidates: [0.298, 0.316]   # returnability-optimal frames f17-f18
      # (phase-scan 2026-07-05, the ONLY window in all 6 clips; video-truth frame 21
      # scores 0% either way). Score depends on ball difficulty: venue-speed balls
      # (~0.8-2.9 m/s) 96%; the stage-1 default speed range [2,5] m/s only 17% ->
      # stage-1 should START at venue-like speeds [~1.0,2.5] and widen (curriculum).
      # NOT a contact-time claim — see the field doc above
    rally_yaw_deg: -40  # calibrated (topspin, 100% at the annotated frame)

  # --- oblique real-play clips (GVHMR video source, R3 arm) --------------------
  hope_forehand_oblique:
    phase: 0.432
    status: verified
    annotator: claude (visual frame scrub, raw_video_oblique/forehand_new.mp4)
    date: 2026-07-05
    method: ball reaches blade at video f025-f026 (t~0.82-0.83s); start-aligned
      mapping -> frame 41 +-2 of 96. The old auto 0.368 (frame 35) is the PRE-CONTACT
      acceleration peak ~120 ms early (ball still 3 video frames away) — the
      pull-up variant of the speed-peak trap. R3 sampling boxes derived at 0.368
      are stale; regenerate from this frame
    source: video-gvhmr
    face_normal_reliable: false
    rally_yaw_deg: 55   # shared v5 grip, zero-shot 100% (topspin +60 / no-spin +50)

  hope_backhand_oblique:
    phase: 0.495
    status: verified
    annotator: claude (visual frame scrub, raw_video_oblique/backhand_new.mp4)
    date: 2026-07-05
    method: ball contacts blade at video f032 (t=1.033s); start-aligned mapping ->
      frame 51.7 of 106; auto value 0.495 (frame 53) agrees within 1.5 frames —
      CONFIRMED (backhand speed peak ~coincides with contact, like v5 backhand)
    source: video-gvhmr
    face_normal_reliable: false
    rally_yaw_deg: -60  # shared v5 grip, zero-shot 100%

  # --- hopex v3 clips (product/default lineage: [0.47, 0.333]) -----------------
  # Source videos reviewed 2026-07-05 (raw_video_hopex/, claude): DRY SWINGS with
  # NO BALL -> there is no observable contact to align; the phases are the
  # forward-swing SPEED-PEAK CONVENTION (fh 18 cm / bh 33 cm past the x=0.40
  # plane; plane crossings sit at ~0.43 / ~0.27). Semantically DIFFERENT from the
  # v5/oblique true-contact phases (those sit near the plane on the rising edge).
  # Do NOT "fix" the values in isolation - the product lineage was trained on this
  # convention; treat the mismatch as a known caveat for the next motion-source
  # decision (R15). GVHMR source -> face normal is a wrist proxy here too.
  hope_forehand_hopex:
    phase: 0.47
    status: verified
    annotator: claude (source-video review + kinematic table)
    date: 2026-07-05
    method: no ball in source video (dry swing) - phase is the speed-peak
      convention, kinematically checked; no physical contact exists to observe
    source: video-gvhmr
    face_normal_reliable: false
    rally_yaw_deg: 40   # dry swing: calibrated-grip window f64-68 straddles the 0.47 convention

  hope_backhand_hopex:
    phase: 0.333
    status: verified
    annotator: claude (source-video review + kinematic table)
    date: 2026-07-05
    method: no ball in source video (dry swing) - phase is the speed-peak
      convention, kinematically checked; no physical contact exists to observe
    source: video-gvhmr
    face_normal_reliable: false
    rally_yaw_deg: -40  # dry swing: window f42-46 straddles the 0.333 convention

  # --- GRIP-CALIBRATED regenerations (2026-07-06, csv_to_npz_mujoco --grip-rot 5 40) ---------
  # Wrist joints re-solved per frame so the ROBOT blade (wrist+Y, STL) points along the
  # calibrated HUMAN blade; worst face residual 0.01 deg, wrist-limit clamps: ZERO on all four
  # (the hardware wrist reaches the calibrated face everywhere). Blade POSITIONS shift with the
  # wrist rotation (up to ~13 cm) — anchors/questions must come from these files, not the originals.
  # Validation at truth frames, rally_yaw applied, plain wrist+Y, venue topspin:
  #   v5 fh 69% / v5 bh 100% / oblique fh 100% / oblique bh 100%.
  hope_forehand_v5_cal:
    phase: 0.673
    status: verified
    annotator: carried from hope_forehand_v5 (grip bake does not change contact TIME)
    source: video-gvhmr + grip-calibrated
    face_normal_reliable: true-calibrated
    rally_yaw_deg: 40

  hope_backhand_v5_cal:
    phase: 0.362
    status: verified
    annotator: carried from hope_backhand_v5
    source: video-gvhmr + grip-calibrated
    face_normal_reliable: true-calibrated
    rally_yaw_deg: -40
    train_phase_candidates: [0.298, 0.316, 0.333]   # re-verify on the _cal kinematics

  hope_forehand_oblique_cal:
    phase: 0.432
    status: verified
    annotator: carried from hope_forehand_oblique
    source: video-gvhmr + grip-calibrated
    face_normal_reliable: true-calibrated
    rally_yaw_deg: 55

  hope_backhand_oblique_cal:
    phase: 0.495
    status: verified
    annotator: carried from hope_backhand_oblique
    source: video-gvhmr + grip-calibrated
    face_normal_reliable: true-calibrated
    rally_yaw_deg: -60

  hope_forehand_v4_cal:
    phase: 0.47
    status: verified
    annotator: carried from hope_forehand_hopex (video rerun through the calibrated pipeline)
    source: video-gvhmr + grip-calibrated
    face_normal_reliable: true-calibrated
    rally_yaw_deg: 40

  hope_backhand_v4_cal:
    phase: 0.333
    status: verified
    annotator: carried from hope_backhand_hopex (video rerun through the calibrated pipeline)
    source: video-gvhmr + grip-calibrated
    face_normal_reliable: true-calibrated
    rally_yaw_deg: -40
