# =============================================================================
# PPO hyperparameters for the Agibot A3 WBC tasks (BeyondMimic / rsl_rl).
#
# Selected on the command line with `algo=ppo` (106B-Final-Project style):
#   python scripts/train.py task=HOPEPingPongDeployParity algo=ppo headless=true \
#       registry_name=<entity>/wandb-registry-motions/hope_forehand
#
# Edit the values here to tune. This same file is the single source of truth for
# both the Hydra `scripts/train.py` and the legacy `scripts/rsl_rl/train.py`.
#
# Confirmed-from-HITTER [H]: PPO, actor/critic MLP [512,256,128], 50 Hz.
# Everything else follows the BeyondMimic G1 defaults; tune freely.
# =============================================================================

name: ppo

runner:
  # ---- training schedule (EDIT) -------------------------------------------
  num_steps_per_env: 24        # rollout length per env before each PPO update
  max_iterations: 300000000000        # total PPO iterations
  # -------------------------------------------------------------------------
  save_interval: 100           # checkpoint every N iterations
  # ⚠ DEAD FLAG **in the simtoreal2 lineage** (jiayi, verified 2026-07-04 across its 6 deployed
  # models): rsl_rl 3.1.2's shim blocks this deprecated runner-level key when the IsaacLab
  # policy cfg emits `actor_obs_normalization: {}` (empty dict != None -> shim skips; {} is
  # falsy -> ActorCritic uses Identity). In THAT lineage checkpoints carry no normalizer state,
  # exports are obs->Gemm direct, and deploy correctly feeds RAW obs. To actually enable
  # normalization there set policy.actor_obs_normalization: true (bool).
  # ⚠ NOT true for the virtual-ball/product lineage (verified 2026-07-04/05, opposite result):
  # those checkpoints DO carry non-trivial obs_norm_state_dict (mean|max|~4, var to ~13 — the
  # 07-04 eval P0: feeding raw obs scored ~0 until the obs_norm.npz sidecar / --bake-obs-norm
  # export restored the transform; model_9600's normbaked ONNX fingerprint-matches actor∘norm).
  # The two lineages evidently take different runner paths — when consolidating training code,
  # VERIFY which path a run uses (make_std_sidecar.py errors loudly if no normalizer state).
  empirical_normalization: true

policy:
  # ---- actor / critic networks (EDIT) -------------------------------------
  actor_hidden_dims: [512, 256, 128]   # HITTER [H]
  critic_hidden_dims: [512, 256, 128]  # HITTER [H]
  activation: elu              # elu, relu, tanh, leaky_relu, gelu, selu
  init_noise_std: 1.0          # initial action exploration std
  # -------------------------------------------------------------------------

algorithm:
  # ---- optimization (EDIT) ------------------------------------------------
  learning_rate: 0.001         # initial LR
  schedule: adaptive           # "adaptive" (KL-based) or "fixed"
  desired_kl: 0.01             # target KL for the adaptive schedule
  entropy_coef: 0.01           # exploration bonus. NOTE merge-audit 2026-07-06: jiayi's
                               # Hitter-scratch runs use 0.015 — un-ablated, so it lives in
                               # HOPEPingPongHitter.yaml (task-level algo override), not in
                               # this global default (every lineage trains through this file)
  num_learning_epochs: 5       # gradient epochs per update
  num_mini_batches: 4          # minibatches per epoch
  # -------------------------------------------------------------------------
  gamma: 0.99                  # discount
  lam: 0.95                    # GAE lambda
  clip_param: 0.2              # PPO clip range
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  max_grad_norm: 1.0
