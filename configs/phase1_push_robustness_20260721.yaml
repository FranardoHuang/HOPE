controls:
  # 人话：无 push 对照不重复购买——矩阵里 w_c_s0/v_c_s0 与本波配方逐字相同
  # （C+S0，push_robot=None），汇总时直接对比它们的里程碑。
  baseline_queue_id: phase1_balance_temporal_matrix_20260720
  baseline_jobs: [w_c_s0, v_c_s0]
  baseline_run_names: [p1btm_w_c_s0_seed3_20260720, p1btm_v_c_s0_seed3_20260720]
  human_note: >-
    人话：矩阵 w_c_s0/v_c_s0 就是本波的无 push 对照（同 C+S0 配方、无推撞），
    不再另买两条 0 推撞臂。

