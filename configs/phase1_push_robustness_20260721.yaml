schema_version: 1
queue_id: phase1_push_robustness_20260721
purpose: >-
  人话：Wave P 12 臂 push 鲁棒性 = 2 父本(W/V) x 6 档推撞，全部固定矩阵 C+S0
  配方（action_rate=-0.10、slew=0、三个稳定机制 weight=0、测量探针全开），从各自
  parent model_6700 续训 10001 个 update。当前配方 push_robot=None 是对齐 HITTER
  的历史决定，本波按论文证据推翻它（PACE：push vxy ±0.2 每 5-15 s；BeyondMimic：
  push vxy ±0.5 + rpy 角速度 每 1-3 s）。无 push 对照不重复买——矩阵 w_c_s0/
  v_c_s0 与本波同配方且无 push，直接当对照。本波不写死 pod/gpu：矩阵占满 24 槽，
  谁先毕业谁腾卡，按 launch_order 空槽即填，渲染时注入目标卡。只渲染命令供人工
  核对后执行，本队列只做仿真，永不驱动真实机器人。
simulation_only: true
real_robot_authorized: false
launch_authorized_by_default: false
formal_exact_eligible: false
evidence_class: diagnostic_only_intentional_parent_contract_mismatch

ssh:
  key: ~/.ssh/id_ed25519_runpod
pods:
  pod1: {host: 162.43.172.171, port: 18333, gpus: [0, 1, 2]}
  pod2: {host: 162.43.172.181, port: 13146, gpus: [0, 1, 2]}

namespace:
  root: /workspace/codexschema/phase1_push_robustness_20260721
  no_clobber: true
  automatic_retry: false

source:
  checkout: /workspace/codexschema/nohope_push_20260721
  identity_mode: clean_detached_exact_commit
  # 人话：task.push.* wiring 由并行 agent 落盘，主控合并后才有最终 40-hex commit；
  # 占位符存在时渲染器拒绝出任何 SSH 命令（--plan/--checklist 不受影响）。
  commit: "f67c844fd4c79b725d878ee0c192204b3290c599"
  worktree_relative: hope_training/whole_body_tracking
  python: /workspace/hope_isaac_venv/bin/python
  setup_relative: setup_train_env.sh
  trainer_relative: scripts/train.py
  locked_launcher_relative: scripts/launch_kit_training_locked.sh
  note: >-
    人话：训练从干净的 detached 精确 commit 检出跑；W/V 与后代 hard contract 有意
    mismatch，所以整条谱系永远不算 formal-exact，胜者档位须另在 exact-lineage 重跑。
    task.push.* 键名已与本地工作树 train.py 的 _PUSH_KEYS 白名单
    （enable/interval_range_s/vel_xy_mps/ang_vel_radps/ang_axes）逐字核对；渲染前
    仍必须 grep 远端 checkout 在 exact commit 上的 train.py 再核对一遍。

watchdog:
  # 人话：v8/v9 死于 launch_kit_training_locked.sh 写死的 180 s stale 门（Kit 编译
  # shader 时日志可以安静 10 分钟以上）。本轮远端命令不用那个 launcher，改用
  # /workspace/bin/kit_boot_lock.sh + setsid nohup 起进程，boot 停滞 1800 s、
  # 首个迭代出现后停滞 900 s 才判死，之后靠事后 artifact 验证（run.log +
  # checkpoint 文件）而不是在线看门狗杀进程。
  boot_stall_timeout_s: 1800
  post_first_iteration_stall_timeout_s: 900
  retry_policy: one_verbatim_retry_suffix_r2
  retry_note: 人话：唯一允许的重试是逐字重发一次，run_name 加 _r2 后缀，仍需人工核对。

assets:
  a3_runtime_asset_root: /workspace/codexschema/nohope_balance_action_slew_20260720/hope_training/whole_body_tracking/source/whole_body_tracking/whole_body_tracking/assets/agibot_a3
  preconverted_a3_usd: /workspace/codexschema/simple_half_second_sprint_20260718/assets/a3_preconverted_usd/model.usd
  motion_forehand: /workspace/codexschema/phase1_fresh_20260711/assets/v4rg_runtime_order_v3/hope_forehand_v4rg_cal.npz
  motion_backhand: /workspace/codexschema/phase1_fresh_20260711/assets/v4rg_runtime_order_v3/hope_backhand_v4rg_cal.npz
