# 人话：唯一的实验维度——底座推撞 6 档。键名按工作树 train.py 落盘的 _PUSH_KEYS
# 白名单逐字：enable + interval_range_s + vel_xy_mps（水平推幅度，装配成 x/y 对称
# 区间，z 永不推）+ ang_vel_radps（角速度幅度）+ ang_axes（none|yaw|rpy 选轴）。
# 展开由 training_contract.push_robot_event_block 单源完成（对称 velocity_range），
# axes='none' 必须配 ang=0、axes=yaw|rpy 必须配 ang>0，错配 boot 即 fail-loud。
# 渲染前仍须 grep 远端 checkout 在 exact commit 上的 train.py 再核对一遍。
# 论文依据：PACE push vxy ±0.2 每 5-15 s；BeyondMimic push vxy ±0.5 + rpy 角速度
# 每 1-3 s。
mechanisms:
  push:
    p02:
      human_name: 人话：最温和档——底座线速度推撞 vx,vy ±0.2 m/s，每 5-15 s 一次（PACE 档位）
      overrides:
        - ++task.push.enable=true
        - ++task.push.interval_range_s=[5.0,15.0]
        - ++task.push.vel_xy_mps=0.2
        - ++task.push.ang_vel_radps=0.0
        - ++task.push.ang_axes=none
    p035:
      human_name: 人话：中档——vx,vy ±0.35 m/s，每 5-15 s 一次（PACE 与 BeyondMimic 之间）
      overrides:
        - ++task.push.enable=true
        - ++task.push.interval_range_s=[5.0,15.0]
        - ++task.push.vel_xy_mps=0.35
        - ++task.push.ang_vel_radps=0.0
        - ++task.push.ang_axes=none
    p05:
      human_name: 人话：强档——vx,vy ±0.5 m/s，每 5-15 s 一次（BeyondMimic 线速度档）
      overrides:
        - ++task.push.enable=true
        - ++task.push.interval_range_s=[5.0,15.0]
        - ++task.push.vel_xy_mps=0.5
        - ++task.push.ang_vel_radps=0.0
        - ++task.push.ang_axes=none
    yaw:
      human_name: 人话：中档 xy ±0.35 m/s 再加偏航角速度 ±0.5 rad/s，每 5-15 s 一次
      overrides:
        - ++task.push.enable=true
        - ++task.push.interval_range_s=[5.0,15.0]
        - ++task.push.vel_xy_mps=0.35
        - ++task.push.ang_vel_radps=0.5
        - ++task.push.ang_axes=yaw
    ang:
      human_name: 人话：中档 xy ±0.35 m/s 再加滚转/俯仰/偏航角速度各 ±0.5 rad/s，每 5-15 s 一次
      overrides:
        - ++task.push.enable=true
        - ++task.push.interval_range_s=[5.0,15.0]
        - ++task.push.vel_xy_mps=0.35
        - ++task.push.ang_vel_radps=0.5
        - ++task.push.ang_axes=rpy
    fast:
      human_name: 人话：中档 xy ±0.35 m/s 但每 1-3 s 就推一次（BeyondMimic 节奏）
      overrides:
        - ++task.push.enable=true
        - ++task.push.interval_range_s=[1.0,3.0]
        - ++task.push.vel_xy_mps=0.35
        - ++task.push.ang_vel_radps=0.0
        - ++task.push.ang_axes=none

probe_contract:
  # 人话：三个稳定机制的测量探针在 12 臂全开——每臂都显式写三个机制 weight
  # （S0 全 0），train.py 会因此强制对应 probe.weight=1.0；slew 探针由 C 档的
  # 显式 hinge 键全程记录。push 本身没有探针键，靠 event 日志与里程碑评估。
  post_swing_settle_debt: auto_forced_probe_weight_1p0_by_explicit_weight_key
  lower_body_stability_bundle: auto_forced_probe_weight_1p0_by_explicit_weight_key
  lower_body_pose_imitation: auto_forced_probe_weight_1p0_by_explicit_weight_key
  processed_qdes_slew: auto_probe_by_explicit_hinge_keys_in_every_cell

budgets:
  probe:
    num_envs: 4096
    num_steps_per_env: 24
    max_iterations: 2
    save_interval: 1
  science:
    num_envs: 4096
    num_steps_per_env: 24
    max_iterations: 10001
    save_interval: 100
    milestone_offsets_from_parent: [200, 500, 1000, 2000, 4000, 6000, 10000]
    absolute_milestones: [6900, 7200, 7700, 8700, 10700, 12700, 16700]

# 人话：本波不写死 pod/gpu——矩阵 24 格谁先毕业谁腾卡，空槽出现时按此顺序拉
# 最前面还没发射的臂填入（parent 与档位交错，前 6 位就覆盖全部 6 档）。
# 渲染时用 --render-job <id> --pod <pod1|pod2> --gpu <0|1|2> 注入目标卡。
launch_order:
  - w_p02
  - v_p035
  - w_p05
  - v_yaw
  - w_ang
  - v_fast
  - w_p035
  - v_p02
  - w_yaw
  - v_p05
  - w_fast
  - v_ang

jobs:
