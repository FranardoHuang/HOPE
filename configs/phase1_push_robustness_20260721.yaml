  - {id: w_p035, parent: W, push: p035, run_name: p1push_w_p035_seed3_20260721, run_dir: /workspace/codexschema/phase1_push_robustness_20260721/runs/w_p035}
  - {id: w_p05, parent: W, push: p05, run_name: p1push_w_p05_seed3_20260721, run_dir: /workspace/codexschema/phase1_push_robustness_20260721/runs/w_p05}
