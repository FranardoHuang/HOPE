# 人话：qbar 渲染闸门。qbar 的 train.py wiring 是并行作业，本 yaml 冻结时本地
# 工作树 grep 无 qdes_limit_barrier——键名按任务书写死如下。主控合并 wiring、
# 逐字核对远端 train.py 白名单与 expected_cli_keys 一致、冻结新 40-hex commit
# 后才把 qbar_wiring_confirmed 翻 true。false 时渲染器拒绝出任何 qbar 臂命令
# （fail-closed），其余六臂不受影响。
qbar_contract:
  qbar_wiring_confirmed: true
  expected_cli_keys:
    - task.rewards.qdes_limit_barrier_weight
    - task.rewards.qdes_limit_barrier_margin_frac
  wiring_note: >-
    人话：全关节（31 关节全部、无 top-k 挑选）qdes 限位 barrier：q_des 距软限位
    不足 margin（0.08 rad）时按有界 tail 罚，逐关节求和不平均（Franco：mean 是
    稀释器；违规几个关节就罚几份，满违规单关节 tail≈1 → 每步约 -0.65×dt），
    weight -0.65。语义按 Jiayi v14 的 top-k qdes barrier 去掉 top-k；本臂同时把
    raw action_rate 归零，barrier 是唯一 qdes 惩罚。exact 语义以合入 main 的
    实现+单测为机器真源，与本段人话不符时必须先修订预注册再渲染命令。caveat：
    Jiayi 侧的训练分布自述还没调好，其 v14 证据只作方向参考。

probe_contract:
  # 人话：三个稳定机制的测量探针在 8 臂全开——每臂都显式写三个机制 weight
  # （fullbody 的模仿 weight=2.0 同样显式），train.py 会因此强制对应
  # probe.weight=1.0；slew 探针由每臂显式的 hinge 键全程记录。
  post_swing_settle_debt: auto_forced_probe_weight_1p0_by_explicit_weight_key
  lower_body_stability_bundle: auto_forced_probe_weight_1p0_by_explicit_weight_key
  lower_body_pose_imitation: auto_forced_probe_weight_1p0_by_explicit_weight_key
  processed_qdes_slew: auto_probe_by_explicit_hinge_keys_in_every_cell

budgets:
  probe:
    num_envs: 4096
    num_steps_per_env: 24
    max_iterations: 2
    save_interval: 1
  science:
    num_envs: 4096
    num_steps_per_env: 24
    max_iterations: 4001
    save_interval: 100
    milestone_offsets_from_parent: [200, 500, 1000, 2000, 4000]
    absolute_milestones: [6900, 7200, 7700, 8700, 10700]

# 人话：本波不写死 pod/gpu——空槽出现时按此顺序拉最前面还没发射的臂填入。
# 顺序即价值排序：速度泛化（最高价值轴）→ 全身模仿 → 强 q_des 平滑 → qbar
# （wiring 闸门未开时跳过 qbar 两臂、不阻塞）。渲染时用
# --render-job <id> --pod <pod1|pod2> --gpu <0|1|2> 注入目标卡。
launch_order:
  - w_spdmix
  - v_spdmix
  - w_fullbody
  - v_fullbody
  - w_hstrong
  - v_hstrong
  - w_qbar
  - v_qbar

