    mismatch，所以整条谱系永远不算 formal-exact，胜者档位须另在 exact-lineage 重跑。
    qbar 两臂另受 qbar_contract.qbar_wiring_confirmed 闸门锁死：本地工作树冻结时
    grep 无 qdes_limit_barrier wiring，键名按任务书写死，主控合并并逐字核对远端
    train.py 白名单后才翻 true（其余六臂不受影响）。spdmix v2 改造（clip_family_per_clip
