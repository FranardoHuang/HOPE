schema_version: 1
queue_id: phase1_intel_wave_20260721
purpose: >-
  人话：Wave Q 情报波 8 臂 = 2 父本(W/V) x 4 档情报臂（spdmix 速度泛化混合
  （v2＝TOPP 烤入变速六 clip 列表，正手 0.8/1.0/1.2＋反手 0.8/1.0/1.1，播放时钟
  恒 1.0）、hstrong 强 q_des 平滑、fullbody 下肢模仿加重、qbar 全关节 qdes 限位 barrier），
  基础配方固定为矩阵 C+S0（action_rate=-0.10、slew=0、三个稳定机制 weight=0、
  测量探针全开；hstrong/qbar 两档把 action_rate 归零是各自档位设计的一部分），
  从各自 parent model_6700 续训 4001 个 update。依据 Franco 2026-07-21 情报：
  速度泛化是最高价值泛化轴（spdmix；拍面/引拍/脚步轴降级）；现役 q_des penalty
  可能太小（hstrong 把恢复窗 slew hinge 提到 -1.0；qbar 按 Jiayi v14 去掉
  top-k、全关节逐关节求和罚限位 barrier，并去掉 action_rate 让 barrier 当唯一
  qdes 惩罚）；全身学习可能很有用（fullbody 下肢姿态模仿 +2.0、支持窗放开到
  全程＝两阶段下肢方案第一阶段）。对照不重复买——矩阵 w_c_s0/v_c_s0 与本波
  基础配方逐字相同，直接当对照。本波不写死 pod/gpu：空槽即填，渲染时注入目标
  卡。只渲染命令供人工核对后执行，本队列只做仿真，永不驱动真实机器人。
