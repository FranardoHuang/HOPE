schema_version: 1
simulation_only: true
launch_authorized: false
preregistration_status: activation_successor_source_pinned_strict_full_scene_probe_pending

ssh:
  key: ~/.ssh/id_ed25519_runpod

pods:
  pod1:
    host: 162.43.172.171
    port: 18333
    gpus: [0, 1, 2]
    max_trainers_per_gpu: 4
  pod2:
    host: 162.43.172.181
    port: 13146
    gpus: [0, 1, 2]
    max_trainers_per_gpu: 3

# Pod1 is reserved for Yikang.  Keeping it in the fixed harness schema does not
# authorize a snapshot, claim, probe, or launch there.
dispatch_pods: [pod2]

shared_control:
  human_name: fresh C V1 plus V2 base-deceleration measurement-complete replacement pair
  initialization: fresh
  seed: 3
  num_envs: 4096
  max_iterations: 1001
  save_interval: 100
  milestones: [200, 500, 1000]
  signed_face_guidance_weight: 0.0
  comparison_status: exact_same_source_matched_pair_required

# Historical 312669c closed only post-swing counters.  The exact successor below
# now contains post-swing, V1, V2 and weight-independent base-decel ledgers on top
# of current main.  This closes the source API gap only: its own strict full-scene
# terminal probe is still missing, so neither row is launchable.
instrumentation_closure:
  telemetry_reference_source_commit: 312669c7bd61f8fc8f5ea99c8e94cfc3ffae9b94
  required_main_hardening_commit: f00c49779174fdf43f861a29ceda0f985be04f31
  telemetry_reference_contains_required_main_hardening: false
  successor_source_commit: 1f0ca12ffd556dc25f6313df559fe0fd6eaee9e6
  successor_contains_required_main_hardening: true
  source_rebind_required_before_launch: false
  strict_full_scene_terminal_probe_required_after_rebind: true
  available_post_swing_replay_metrics:
    buffer_not_ready: Live/motion/post_swing_replay_buffer_not_ready_reset_count
    eligible_denominator: Live/motion/post_swing_replay_eligible_reset_count
    random_not_selected: Live/motion/post_swing_replay_random_not_selected_reset_count
    selected_numerator: Live/motion/post_swing_replay_selected_reset_count
    started_numerator: Live/motion/post_swing_replay_started_reset_count
  successor_runtime_metrics:
    v1_free_wrist_linear_velocity:
      eligible_denominator: Live/motion/v1_velocity_mimic_eligible_sample_count
      exclusion_numerator: Live/motion/v1_held_wrist_excluded_sample_count
    v2_strike_window_imitation_scale:
      eligible_denominator: Live/motion/v2_strike_window_eligible_imitation_sample_count
      scaled_window_numerator: Live/motion/v2_quarter_scaled_strike_window_imitation_sample_count
    base_deceleration:
      eligible_denominator: Live/racket_target/base_decel_eligible_sample_count
      raw_kernel_sum: Live/racket_target/base_decel_raw_kernel_sum
      raw_kernel_nonzero_numerator: Live/racket_target/base_decel_raw_kernel_nonzero_sample_count
  existing_base_deceleration_metrics:
    weighted_reward_mean: Live/Reward/base_decel
    zero_masked_speed_mean: Live/racket_target/base_speed_xy_prestrike
    sufficient_for_activation: false
    reason: neither existing mean exposes the pre-strike and not-in-hold eligible sample denominator

decision_contract:
  evidence_scope: paired_training_diagnostics_only
  aggregation: trailing_21_updates_at_each_milestone
  activation_must_precede_behavior_comparison: true
  missing_activation_makes_run: invalid_instrumentation_blocked
  activation:
    post_swing_replay_start:
      common_probability: 0.25
      denominator_definition: true_episode_resets_after_post_swing_buffer_min_fill
      selected_numerator_definition: eligible_resets_selected_by_the_frozen_probability_draw
      started_numerator_definition: selected_resets_after_root_and_joint_state_writes_return
      tensorboard_metrics:
        buffer_not_ready: Live/motion/post_swing_replay_buffer_not_ready_reset_count
        eligible_denominator: Live/motion/post_swing_replay_eligible_reset_count
        random_not_selected: Live/motion/post_swing_replay_random_not_selected_reset_count
        selected_numerator: Live/motion/post_swing_replay_selected_reset_count
        started_numerator: Live/motion/post_swing_replay_started_reset_count
      selected_plus_random_not_selected_must_equal_eligible: true
      started_must_equal_selected: true
      eligible_denominator_must_be_positive: true
      selected_numerator_must_be_positive: true
      started_numerator_must_be_positive: true
      realized_started_fraction_min: 0.20
      realized_started_fraction_max: 0.30
    v1_free_wrist_linear_velocity:
      setting: true
      telemetry_status_in_successor_source: instrumented_probe_pending
      eligible_denominator_metric: Live/motion/v1_velocity_mimic_eligible_sample_count
      exclusion_numerator_metric: Live/motion/v1_held_wrist_excluded_sample_count
      eligible_denominator_must_be_positive: true
      exclusion_numerator_must_be_positive: true
      exclusion_must_equal_eligible: true
    v2_strike_window_imitation_scale:
      setting: 0.25
      telemetry_status_in_successor_source: instrumented_probe_pending
      counting_unit: imitation_reward_term_x_environment_sample
      eligible_denominator_metric: Live/motion/v2_strike_window_eligible_imitation_sample_count
      scaled_window_numerator_metric: Live/motion/v2_quarter_scaled_strike_window_imitation_sample_count
      eligible_denominator_must_be_positive: true
      scaled_window_numerator_must_be_positive: true
      scaled_window_must_equal_eligible: true
    base_deceleration:
      telemetry_status_in_successor_source: instrumented_probe_pending
      denominator_definition: pre_strike_and_not_in_hold_environment_samples_observed_every_command_step
      eligible_denominator_metric: Live/racket_target/base_decel_eligible_sample_count
      raw_kernel_sum_metric: Live/racket_target/base_decel_raw_kernel_sum
      raw_kernel_nonzero_numerator_metric: Live/racket_target/base_decel_raw_kernel_nonzero_sample_count
      existing_weighted_reward_metric: Live/Reward/base_decel
      raw_kernel_nonzero_must_not_exceed_eligible: true
      control:
        weight: 0.0
        eligible_denominator_must_be_positive: true
        raw_kernel_sum_must_be_positive: true
        raw_kernel_nonzero_numerator_must_be_positive: true
      treatment:
        weight: 1.0
        eligible_denominator_must_be_positive: true
        raw_kernel_sum_must_be_positive: true
        raw_kernel_nonzero_numerator_must_be_positive: true
  milestone_rules:
    200:
      purpose: direction_only_after_all_activation_and_finite_checks
      base_speed_xy_prestrike_treatment_over_control_max: 1.0
      pre_fall_rate_treatment_minus_control_max: 0.05
      precision_pass_rate_treatment_minus_control_min: -0.10
      stop_or_promote_allowed: false
    500:
      purpose: causal_screen_after_all_activation_and_finite_checks
      base_speed_xy_prestrike_treatment_over_control_max: 0.90
      pre_fall_rate_treatment_minus_control_max: 0.02
      precision_pass_rate_treatment_minus_control_min: -0.05
      stop_or_promote_allowed: false
    1000:
      purpose: terminal_training_diagnostic_after_all_activation_and_finite_checks
      base_speed_xy_prestrike_treatment_over_control_max: 0.90
      pre_fall_rate_treatment_minus_control_max: 0.02
      precision_pass_rate_treatment_minus_control_min: -0.05
      stop_or_promote_allowed: false
  precision_pass_rates:
    - racket_position_pass
    - racket_velocity_pass
    - signed_racket_normal_pass
    - strike_composite_pass
  second_seed_authorized: false
  judge_authorized: false
  promotion_authorized: false

