      parent_recipe_replacements: []
      temporal_overrides: *temporal_c
      stability_overrides: *stability_s0
      extra_overrides:
        - ++task.rewards.foot_soft_landing_weight=-0.003
        - ++task.rewards.foot_soft_landing_force_threshold_n=300.0
    penlight:
      human_name: 人话：软惩罚减负——六个软惩罚统一降到约 1/3（脚朝向 -0.3→-0.1、挥拍前直立 -1.0→-0.33、拍面条件引导 -0.4→-0.13、挥拍前脚滑 -0.4→-0.13、触地脚蹭滑 -1.0→-0.33、拖脚 -0.5→-0.17），硬保护（关节限位/包络/qdes_clamp）一个不动。Franco 第 8 条真意：不是模仿淹没击球，是软限制压制模仿→学不会击球，先给惩罚减负看击球恢复。蹭滑/拖脚两键是 07-22 新接的 CLI（此前源码常开够不着），故本臂同受 groundfoot 闸门锁
      base_replacements:
        - old: ++task.rewards.racket_face_conditional_guidance_weight=-0.4
          new: ++task.rewards.racket_face_conditional_guidance_weight=-0.13
      parent_recipe_replacements:
        - old: task.rewards.foot_orientation_weight=-0.3
          new: task.rewards.foot_orientation_weight=-0.1
        - old: task.rewards.prestrike_upright_weight=-1.0
          new: task.rewards.prestrike_upright_weight=-0.33
      temporal_overrides: *temporal_c
      stability_overrides: *stability_s0
      extra_overrides:
        - task.rewards.pre_strike_foot_slip_weight=-0.13
        - ++task.rewards.foot_slip_sq_weight=-0.33
        - ++task.rewards.foot_drag_weight=-0.17
    kdpassive:
      human_name: 人话：被动阻尼折进训练 kd——jiayi 07-09 起的 A/B 收据（挥拍后基座漂移均值 0.066→0.084、峰值 0.121→0.464，复现~90% AGI 台架跟随放大）说明训练 kd 与部署有效 kd 有缝。此键 passive_damping_fold 源码【完全没接线】：kdpassive_contract 闸门锁死渲染，实现+单测合入 main 并核对远端白名单后才翻 true
      base_replacements: []
      parent_recipe_replacements: []
      temporal_overrides: *temporal_c
      stability_overrides: *stability_s0
      extra_overrides:
        - ++task.plant.passive_damping_fold=true

# 人话：grip/rough/footrw/penlight 渲染闸门。四臂依赖的新键（task.plant 地面摩擦/
# 材质范围/粗糙地形 + task.rewards 脚部 reward + 蹭滑/拖脚剂量键）wiring 已于
# 2026-07-22 在本地工作分支落盘且 host 测试全绿（test_ground_plant_wiring.py 38 绿 +
# test_foot_contact_shaping.py 42 绿），但尚未合并、未钉 40-hex。主控合并后 grep 远端
# checkout 在 exact commit 上的 train.py，确认 expected_cli_keys 逐字都在白名单里，
# 才翻 wiring_confirmed=true。false 时渲染器拒绝出这四臂的任何命令（fail-closed），
# 其余四臂不受影响。
groundfoot_contract:
  wiring_confirmed: true
  expected_cli_keys:
    - task.plant.robot_material_static_friction_range
    - task.plant.robot_material_dynamic_friction_range
    - task.plant.terrain_rough_height_range
    - task.rewards.foot_soft_landing_weight
    - task.rewards.foot_soft_landing_force_threshold_n
    - task.rewards.foot_slip_sq_weight
    - task.rewards.foot_drag_weight
  wiring_note: >-
    人话：grip 用材质范围两键；rough 用粗糙地形键（另有 ground_static/dynamic_friction
    两键本波不用但同批落盘）；footrw 用落地冲击两键；penlight 用蹭滑/拖脚剂量两键
    （此前源码常开 -1.0/-0.5、CLI 够不着）。plant 键变动会进 schema-3 ground_plant
    合同块——grip/rough 的 checkpoint 从此与平地谱系互相拒绝静默续训，这是设计不是
    事故。exact 语义以合入 main 的实现+单测为机器真源。

# 人话：kdpassive 渲染闸门。passive_damping_fold 在源码里完全不存在（今天只冻结键名），
# 与 groundfoot 不同——那三臂是"已实现待合并"，这臂是"未实现"。谁实现谁补单测，合入
# main 且远端白名单核对一致后才翻 true；键名若改必须先修订本预注册再渲染。
kdpassive_contract:
  wiring_confirmed: false
  expected_cli_keys:
    - task.plant.passive_damping_fold
  wiring_note: >-
    人话：把部署侧被动阻尼折算进训练 actuator kd（jiayi 0d0c777b 家族思想），让训练
    plant 的有效阻尼对齐台架。实现要求：默认 false = 字节等价；true 时折算量进
    schema-3 合同（照 ground_plant 先例做块指纹）；A/B 收据见 jiayi 07-09 台账。

probe_contract:
  # 人话：三个稳定机制的测量探针在 8 臂全开——每臂都显式写三个机制 weight=0，
  # train.py 会因此强制对应 probe.weight=1.0；slew 探针由每臂显式的 hinge 键全程记录。
  post_swing_settle_debt: auto_forced_probe_weight_1p0_by_explicit_weight_key
  lower_body_stability_bundle: auto_forced_probe_weight_1p0_by_explicit_weight_key
  lower_body_pose_imitation: auto_forced_probe_weight_1p0_by_explicit_weight_key
  processed_qdes_slew: auto_probe_by_explicit_hinge_keys_in_every_cell

budgets:
  probe:
    num_envs: 4096
    num_steps_per_env: 24
    max_iterations: 2
    save_interval: 1
  science:
    # 人话：7 条续训臂——6700 + 13301 ≈ 20001，对齐 Jiayi 新目标 2万-2.5万 iter 的下沿。
    num_envs: 4096
    num_steps_per_env: 24
    max_iterations: 13301
    save_interval: 100
    milestone_offsets_from_parent: [200, 500, 1000, 2000, 4000, 6600, 10000, 13300]
    absolute_milestones: [6900, 7200, 7700, 8700, 10700, 13300, 16700, 20000]
  science_fresh:
    # 人话：rough 一臂 fresh-from-random 独立预算——从零到 20001，里程碑照 fresh 谱系惯例。
    num_envs: 4096
    num_steps_per_env: 24
    max_iterations: 20001
    save_interval: 100
    absolute_milestones: [200, 500, 1000, 2000, 4000, 10700, 20000]

