schema_version: 1
queue_id: phase1_chatter_ground_foot_wave_20260722
purpose: >-
  人话：抖动-地面-脚部消融波 8 臂，父本只用 W（拍心优先×自由非击球臂），基础配方
  固定为矩阵 C+S0（action_rate=-0.10、slew=0、三个稳定机制 weight=0、测量探针全开），
  对照不重复买＝矩阵 w_c_s0。动机（Franco 2026-07-22 八条 + 站立异响 E1 复核 PDF）：
  部署侧站立异响首查高增益静态站立，但训练侧 action-rate 偏弱与 plant 覆盖缺口
  （地面摩擦/不平整从没随机过）成立，正好本波消融。8 臂：ar02/ar05/ar10 把
  action_rate 从 -0.1 加到 -0.2/-0.5/-1.0（别人经验 0.1 一路测到 1；jiayi V15 反向
  情报＝降到 -0.01 靠投影约束管平滑，正反两说都记录）；grip 把机器人材质摩擦随机化
  下界抬高（脚不搓地假设）；rough 上随机凹凸地形（fresh-from-random，平地 checkpoint
  不能静默上粗糙地）；footrw 开 mjlab 落地冲击惩罚（注意：实现输出是无量纲超阈倍数
  不是牛顿，mjlab -1e-5/N 等效剂量 = -1e-5 x 300 N = -3e-3）；penlight 软惩罚组统一
  降约 1/3（Franco 第 8 条真意：新加软限制压制模仿→学不会击球，先给惩罚减负）；
  kdpassive 被动阻尼折进训练 kd（jiayi 07-09 A/B 收据：基座漂移均值 0.066→0.084、
  峰值 0.121→0.464，复现~90% AGI 台架跟随放大——此键源码未接线，闸门锁死）。
  本波不写死 pod/gpu：空槽即填，渲染时注入目标卡。只渲染命令供人工核对后执行，
  本队列只做仿真，永不驱动真实机器人。
simulation_only: true
real_robot_authorized: false
launch_authorized_by_default: false
formal_exact_eligible: false
evidence_class: diagnostic_only_intentional_parent_contract_mismatch

ssh:
  key: ~/.ssh/id_ed25519_runpod
pods:
  # 人话：07-22 两 pod SSH 全失联（网络已排除＝pod 停机/换端口）。端点先照抄历史值，
  # pod 恢复后若端口变了须先改这里再渲染（渲染出的命令带端口，错端口连不上无害）。
  pod1: {host: 162.43.172.171, port: 18333, gpus: [0, 1, 2]}
  pod2: {host: 162.43.172.181, port: 13146, gpus: [0, 1, 2]}

namespace:
  root: /workspace/codexschema/phase1_chatter_ground_foot_wave_20260722
  no_clobber: true
  automatic_retry: false

source:
  # 人话：本波依赖今天(07-22)落盘的三组 wiring——地面摩擦/粗糙地形键、脚部 reward 键、
  # YAML-null 删参+归一化预检+精确续训包。必须先把工作分支
  # Franco_codex/chatter-friction-footwork-wave-20260722 合并进 main（或钉住该分支
  # 提交）、在 pod 上重新 checkout，才有最终 40-hex。占位符存在时渲染器拒绝出任何
  # SSH 命令（--plan/--checklist 不受影响）。
  checkout: /workspace/codexschema/nohope_cgf_20260722
  identity_mode: clean_detached_exact_commit
  commit: "b9c8fff2c10e65aed93fdc9ac2d96a64346aaef4"
  worktree_relative: hope_training/whole_body_tracking
  python: /workspace/hope_isaac_venv/bin/python
  setup_relative: setup_train_env.sh
  trainer_relative: scripts/train.py
  locked_launcher_relative: scripts/launch_kit_training_locked.sh
  note: >-
    人话：训练从干净的 detached 精确 commit 检出跑；W 与后代 hard contract 有意
    mismatch（grip 两臂还会因新 ground_plant 合同块 mismatch——这正是指纹在工作），
    所以整条谱系永远不算 formal-exact，胜者档位须另在 exact-lineage 重跑。三个闸门：
    groundfoot_contract 锁 grip/rough/footrw（新键 wiring 已在本地工作树落盘+测试全绿，
    但未合并未钉 40-hex，主控 grep 远端 train.py 白名单核对后才翻 true）；
    kdpassive_contract 锁 kdpassive（passive_damping_fold 源码完全没接线，实现+单测
    合入后才翻）；rough 臂另受 fresh_from_random 铁律（平地 checkpoint 禁止静默上
    粗糙地——ground_plant 合同块会拒，本波直接不传 resume）。

watchdog:
  # 人话：逐字继承 intel wave——boot 停滞 1800 s（Kit 编译 shader 可安静 10 分钟+）、
  # 首迭代后停滞 900 s 才判死；不用 launch_kit_training_locked.sh 的 180 s stale 门
  # （v8/v9 死因）。唯一允许的重试是逐字重发一次，run_name 加 _r2 后缀。
  boot_stall_timeout_s: 1800
  post_first_iteration_stall_timeout_s: 900
  retry_policy: one_verbatim_retry_suffix_r2
  retry_note: 人话：唯一允许的重试是逐字重发一次，run_name 加 _r2 后缀，仍需人工核对。

