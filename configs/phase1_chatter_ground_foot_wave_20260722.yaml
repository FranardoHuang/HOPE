# 人话：唯一的实验维度——8 档消融臂。每档显式携带完整 temporal（5 行）与 stability
# （26 行）串（COMMON 冻结设计；ar 三臂只改 action_rate 一行，其余臂 temporal 逐字
# = 矩阵 C 档；stability 全臂逐字 = 矩阵 S0 档）。改动落点分四类：
# temporal 首行（ar02/ar05/ar10）、base_replacements 原位替换 base 行（penlight 的
# 拍面条件引导减负）、parent_recipe_replacements 原位替换 W 配方行（penlight 的
# 脚朝向/挥拍前直立减负——本波新增字段，intel wave 没有，因为它的臂不动父本配方）、
# extra_overrides 纯加键（grip/rough/footrw/penlight 剂量与 kdpassive 开关）。
