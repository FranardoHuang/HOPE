  arms:
    ar02:
      human_name: 人话：动作平滑罚 x2——action_rate 从 -0.1 加到 -0.2（别人经验 0.1 一路测到 1 的第一档；jiayi V15 反向情报＝降到 -0.01 靠投影约束管平滑，正反两说都记录），其余与对照逐字同
