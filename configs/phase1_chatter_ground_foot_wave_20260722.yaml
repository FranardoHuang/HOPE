      human_name: 人话：脚部落地冲击惩罚（mjlab soft_landing 思想）——first-contact 步法向峰值力超 300 N 的部分按阈值归一后惩罚。量纲要点：实现输出是无量纲超阈倍数（单脚封顶 3），不是牛顿；mjlab -1e-5/N 的等效剂量 = -1e-5 x 300 = -3e-3，此为起步档（别抄 -0.1，那是 mjlab 剂量的 33 倍）。foot_clearance（抬脚高度）站立击球不开；蹭滑/拖脚剂量键 07-22 已接线但本臂不动（单变量：本臂只买落地冲击，蹭滑/拖脚减负归 penlight）。受 groundfoot 闸门锁
