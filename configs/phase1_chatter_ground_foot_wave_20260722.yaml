    rough:
      human_name: 人话：不平整地形——随机凹凸高度场 2-6 cm（isaaclab random_rough），fresh-from-random 从零训 20001 个 update（平地 checkpoint 不能静默上粗糙地，ground_plant 合同块也会拒绝那种 resume）；配方串仍用 W（配方是实验设计，不是谱系）。受 groundfoot 闸门锁
