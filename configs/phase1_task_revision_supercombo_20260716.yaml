jobs:
  # Round 1: complete core, two planner-noise levels, timestamp negative, and reward allocation.
  - <<: *pod1_job
    id: taskrev_p1_core_low_noise
    human_name: 同一来球实时更新的低噪声完整基线
    scientific_question: does_the_complete_same_ball_revision_core_learn_with_low_planner_noise
    launch_round: 1
    timestamp_role: compensated_treatment
    matched_timestamp_job: taskrev_p1_uncompensated_negative
    scientific_launch_authorized: false
    scientific_blocker: governor_actor_transport_not_atomic
    recipe:
      base: *base
      delta: [*planner_balanced_low, task.racket.target_delay_steps=2]
    resource: *pod1_gpu0
    run_name: phase1_taskrev_p1_core_low_noise_seed3_20260716
    run_dir: /workspace/codexschema/phase1_task_revision_supercombo_20260716/runs/p1_core_low_noise
  - <<: *pod1_job
    id: taskrev_p1_core_high_noise
    human_name: 同一来球实时更新的高噪声完整基线
    scientific_question: does_the_complete_same_ball_revision_core_remain_learnable_with_high_planner_noise
    launch_round: 1
    recipe: {base: *base, delta: [*planner_balanced_high]}
    resource: *pod1_gpu1
    run_name: phase1_taskrev_p1_core_high_noise_seed3_20260716
    run_dir: /workspace/codexschema/phase1_task_revision_supercombo_20260716/runs/p1_core_high_noise
  - <<: *pod1_job
    id: taskrev_p1_uncompensated_negative
    human_name: 与低噪声基线逐项匹配但故意不扣感知延迟
    scientific_question: does_removing_source_timestamp_compensation_hurt_an_otherwise_matched_revision_policy
    launch_round: 1
    timestamp_role: uncompensated_negative_control
    matched_timestamp_job: taskrev_p1_core_low_noise
    scientific_launch_authorized: false
    scientific_blocker: governor_actor_transport_not_atomic
    recipe:
      base: *base
      delta: [*planner_balanced_low, task.racket.target_delay_steps=2, ++task.racket.target_delay_tts_mode=uncompensated]
    resource: *pod1_gpu2
    run_name: phase1_taskrev_p1_uncompensated_negative_seed3_20260716
    run_dir: /workspace/codexschema/phase1_task_revision_supercombo_20260716/runs/p1_uncompensated_negative
  - <<: *pod2_quality_job
    id: taskrev_p2_equal_reward
    human_name: 位置速度拍面固定总预算近似均分
    scientific_question: does_equal_hit_reward_allocation_help_the_complete_revision_core
    launch_round: 1
    recipe:
      base: *base
      delta: [*planner_balanced_low, task.rewards.racket_position_weight=9.67, task.rewards.racket_velocity_weight=9.67, task.rewards.racket_normal_weight=9.66]
    resource: *pod2_gpu0
    run_name: phase1_taskrev_p2_equal_reward_seed3_20260716
    run_dir: /workspace/codexschema/phase1_task_revision_supercombo_20260716/runs/p2_equal_reward
  - <<: *pod2_quality_job
    id: taskrev_p2_velocity_reward
    human_name: 固定总预算下更重视击球速度
    scientific_question: does_velocity_heavy_reward_reduce_late_or_too_slow_contacts_under_live_revision
    launch_round: 1
    recipe:
      base: *base
      delta: [*planner_balanced_low, task.rewards.racket_position_weight=8.0, task.rewards.racket_velocity_weight=16.0, task.rewards.racket_normal_weight=5.0]
    resource: *pod2_gpu1
    run_name: phase1_taskrev_p2_velocity_reward_seed3_20260716
    run_dir: /workspace/codexschema/phase1_task_revision_supercombo_20260716/runs/p2_velocity_reward
  - <<: *pod2_quality_job
    id: taskrev_p2_normal_reward
    human_name: 固定总预算下更重视有符号拍面方向
    scientific_question: does_normal_heavy_reward_preserve_signed_face_control_while_the_target_moves
    launch_round: 1
    recipe:
      base: *base
      delta: [*planner_balanced_low, task.rewards.racket_position_weight=10.0, task.rewards.racket_velocity_weight=8.0, task.rewards.racket_normal_weight=11.0]
    resource: *pod2_gpu2
    run_name: phase1_taskrev_p2_normal_reward_seed3_20260716
    run_dir: /workspace/codexschema/phase1_task_revision_supercombo_20260716/runs/p2_normal_reward

  # Round 2: balance, non-striking arm freedom, and three meaningful joint-speed limits.
  - <<: *pod1_job
    id: taskrev_p1_strong_foot_ready
    human_name: 加强脚朝向与挥拍前直立约束
