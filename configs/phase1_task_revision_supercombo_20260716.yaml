    run_dir: /workspace/codexschema/phase1_task_revision_supercombo_20260716/runs/p2_no_joint_speed_penalty
  - <<: *pod2_quality_job
    id: taskrev_p2_free_arm_strong_ready
    human_name: 放开非击球臂并加强脚与直立准备
    scientific_question: can_a_free_non_striking_arm_and_stronger_ready_terms_cooperate_instead_of_compete
    launch_round: 2
    recipe:
      base: *base
      delta: [*planner_balanced_low, ++task.rewards.free_non_striking_arm_mimic=true, task.rewards.foot_orientation_weight=-0.6, task.rewards.prestrike_upright_weight=-2.0]
    resource: *pod2_gpu1
    run_name: phase1_taskrev_p2_free_arm_strong_ready_seed3_20260716
