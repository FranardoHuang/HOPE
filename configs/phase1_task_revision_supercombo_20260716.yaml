timing_exam_contract:
  paper: configs/phase1_timing_exam_0p5_k100_20260716.json
  status: pending_checkpoint_bound_full_scene_execution
  exact_0p5_seconds_is_required_baseline: true
  below_0p5_seconds_is_stress_only: true
  all_attempts_denominator: true
  zero_sparse_score_with_zero_eligible_attempts_may_stop: false
  vendor_mujoco_required_before_demo_winner_claim: true

task_revision_execution_contract:
  actor_visible_revision_fields: [target_position, target_velocity, signed_target_normal, time_to_strike]
  update_window: every_policy_tick_through_last_pre_contact_tick
  policy_tick_s: 0.02
  same_ball_revision_is_not_a_new_task: true
  side_and_clip_are_task_invariant: true

transport_atomicity_contract:
  status: delay_zero_only_until_coupled_governor_actor_transport_exists
  launchable_target_delay_steps: [0]
  blocked_job_ids:
    - taskrev_p1_core_low_noise
    - taskrev_p1_uncompensated_negative
  blocker: governor_actor_transport_not_atomic
  blocked_pair_is_not_counted_as_a_runtime_or_reward_failure: true

exact_behavior_ledger_contract:
  schema: exact_behavior_update_v1
  event_prefix: HOPE_EXACT_BEHAVIOR_UPDATE_JSON=
  consume_once_per_update: true
  window_updates: 100
  missing_or_duplicate_update_action: continue_training_no_decision
  derive_after_summing_window_counters: true
  required_counters:
    - swing_start_count
    - swing_outcome_count
    - swing_completion_count
    - strike_opportunity_count
    - virtual_capture_count
    - virtual_net_clear_count
    - virtual_landing_valid_count
    - virtual_legal_return_count
    - physical_fall_count
    - pre_strike_physical_fall_count
    - post_strike_physical_fall_count
    - non_physical_terminal_reset_count
    - termination_reason_base_fell_tilt_count
    - termination_reason_base_too_low_count
    - ready_tilt_eligible_sample_count
    - ready_tilt_rad_sum
    - ready_base_speed_eligible_sample_count
    - ready_base_speed_xy_mps_sum
    - ready_station_offset_eligible_sample_count
    - ready_station_offset_m_sum
    - ready_foot_contact_eligible_sample_count
    - ready_foot_contact_fraction_sum
    - ready_foot_slip_eligible_sample_count
    - ready_foot_slip_speed_mps_sum
    - planner_initial_tts_sample_count
    - planner_initial_tts_sub_0p5_count
    - planner_initial_tts_exact_0p5_count
    - planner_initial_tts_above_0p5_count
    - planner_initial_tts_component_0_count
    - planner_initial_tts_component_1_count
    - planner_initial_tts_component_2_count
    - planner_initial_tts_component_3_count
    - planner_revision_attempt_count
    - planner_revision_accepted_count
    - planner_revision_rejected_count
    - planner_revision_last_precontact_attempt_count
    - planner_revision_last_precontact_accepted_count
    - planner_revision_actor_visible_count
    - planner_revision_last_precontact_actor_visible_count
  invariants:
    - swing_completion_count_is_between_zero_and_swing_outcome_count
    - pre_plus_post_physical_fall_equals_physical_fall_is_at_most_swing_outcome_count
    - both_bound_physical_fall_reason_counters_must_exist_or_window_is_no_decision
    - swing_start_and_strike_opportunity_are_diagnostic_and_may_cross_window_boundaries
    - each_ready_sum_has_its_own_nonnegative_eligible_count
    - initial_tts_sample_count_equals_component_sum_and_three_way_stratum_sum
    - planner_revision_attempt_count_equals_accepted_plus_rejected
    - last_precontact_accepted_is_at_most_last_precontact_attempt_is_at_most_all_attempts
    - actor_visible_is_at_most_accepted_and_last_precontact_actor_visible_is_positive_in_probe
    - zero_denominator_derives_null_never_zero

full_scene_probe_contract:
  representative_job_id: taskrev_p1_core_high_noise
  generic_reviewed_result_required: true
  specialized_no_clobber_result: task_revision_probe_result.json
  minimum_consecutive_exact_updates: 2
  initial_tts_all_four_components_must_be_observed: true
  initial_tts_sub_exact_and_above_0p5_must_all_be_observed: true
  planner_revision_attempt_accept_reject_identity_must_hold: true
  accepted_revision_must_be_observed: true
  accepted_last_precontact_revision_must_be_observed: true
  actor_visible_revision_must_be_observed: true
  actor_visible_last_precontact_revision_must_be_observed: true
  exact_behavior_ledger_must_be_complete: true
  generic_pass_without_specialized_pass_may_unlock_launch: false

behavior_decision_receipt_contract:
  directory: behavior_milestones
  publish: atomic_no_clobber
  exact_log_prefix_bound_by_inode_size_and_sha256: true
  checkpoint_receipt_required: true
  claim_binding_process_identity_required: true
  automatic_signal_authorized: false
  exact_stop_consumer: reviewed_numeric_identity_v1
  manual_command: exact-stop-behavior
  required_revalidation: [job, claim, binding, pid, pgid, starttime, argv, checkpoint_receipt, behavior_receipt]
  no_clobber_intent_before_signal: true
  exact_group_membership_required_before_term_or_kill: true

pruning_contract:
  checkpoint_offsets_from_parent: [200, 500, 1000, 2000]
  behavior_decision_requires_two_disjoint_complete_windows: true
  sparse_zero_without_positive_eligible_denominator_may_stop: false
  automatic_retry: false
  plus_200:
    behavior_ranking_authorized: false
    stop_only_for: [fatal, nonfinite, resume_or_contract_mismatch, revision_or_ledger_activation_absent]
  plus_500:
    required_complete_windows: 2
    window_updates: 100
    stop_only_if_all_true:
      - both_windows_closeout_completion_rate_below_0p40
      - both_windows_combined_physical_fall_above_0p10
      - second_window_improves_no_ready_metric_over_first
    sparse_outcome_alone_may_stop: false
  plus_1000:
    comparison_scope: same_parent_only
    pareto_metrics:
      maximize: [swing_closeout_completion_rate, virtual_legal_return_per_strike, ready_foot_contact_fraction_mean]
      minimize: [pre_strike_physical_fall_rate, post_strike_physical_fall_rate, ready_tilt_rad_mean, ready_base_speed_xy_mps_mean, ready_foot_slip_speed_mps_mean]
    minimum_survivors_per_parent: 2
    preserve_at_least_one_exact_0p5_exposed_candidate: true
    preserve_at_least_one_broad_arrival_candidate: true
  plus_2000:
    terminal_portfolio_ranking: true
    checkpoint_bound_0p5_k100_required: true
    vendor_mujoco_required_before_winner_claim: true
  freed_slot_policy:
    first_effect: surviving_cells_receive_more_throughput
    unregistered_replacement_forbidden: true
    stochastic_torso_push_status: omitted_until_E1_full_scene_launch_gate_passes

