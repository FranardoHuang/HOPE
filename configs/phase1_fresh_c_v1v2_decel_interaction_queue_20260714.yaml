schema_version: 1
simulation_only: true
launch_authorized: false
preregistration_status: blocked_pending_representative_full_scene_probe

ssh:
  key: ~/.ssh/id_ed25519_runpod

pods:
  pod1:
    host: 162.43.172.171
    port: 18333
    gpus: [0, 1, 2]
    max_trainers_per_gpu: 4
  pod2:
    host: 162.43.172.181
    port: 13146
    gpus: [0, 1, 2]
    max_trainers_per_gpu: 3

# Pod1 is reserved for Yikang. Both blocked cells may eventually dispatch only
# to Pod2, after an exact reviewed P1 source replaces the fail-closed source
# placeholder below.
dispatch_pods: [pod2]

shared_control:
  human_name: fresh C V1 plus V2 interaction control with base deceleration off
  initialization: fresh
  seed: 3
  num_envs: 4096
  max_iterations: 1001
  save_interval: 100
  milestones: [200, 500, 1000]
  signed_face_guidance_weight: 0.0
  comparison_status: exact_same_source_matched_pair_required

decision_contract:
  evidence_scope: paired_training_diagnostics_only
  aggregation: trailing_21_updates_at_each_milestone
  activation_required_before_comparison: true
  activation:
    v1_free_wrist_linear_velocity:
      control_and_treatment:
        setting: true
        eligible_denominator_must_be_positive: true
        exclusion_numerator_must_be_positive: true
    v2_strike_window_imitation_scale:
      control_and_treatment:
        setting: 0.25
        eligible_denominator_must_be_positive: true
        scaled_window_numerator_must_be_positive: true
    base_deceleration:
      control:
        weight: 0.0
        eligible_denominator_must_be_positive: true
        nonzero_reward_numerator_must_equal: 0
      treatment:
        weight: 1.0
        eligible_denominator_must_be_positive: true
        nonzero_reward_numerator_must_be_positive: true
  milestone_rules:
    200:
      purpose: direction_only_keep_training_if_active_and_finite
      base_speed_xy_prestrike_treatment_over_control_max: 1.0
      pre_fall_rate_treatment_minus_control_max: 0.05
      precision_pass_rate_treatment_minus_control_min: -0.10
      stop_or_promote_allowed: false
    500:
      purpose: causal_screen
      base_speed_xy_prestrike_treatment_over_control_max: 0.90
      pre_fall_rate_treatment_minus_control_max: 0.02
      precision_pass_rate_treatment_minus_control_min: -0.05
      stop_or_promote_allowed: false
    1000:
      purpose: terminal_training_diagnostic
      base_speed_xy_prestrike_treatment_over_control_max: 0.90
      pre_fall_rate_treatment_minus_control_max: 0.02
      precision_pass_rate_treatment_minus_control_min: -0.05
      stop_or_promote_allowed: false
  precision_pass_rates:
    - racket_position_pass
    - racket_velocity_pass
    - signed_racket_normal_pass
    - strike_composite_pass
  second_seed_authorized: false
  judge_authorized: false
  promotion_authorized: false

x-action: &action signed_face_v4rg_shared_face
x-motion: &motion
  action: signed_face_v4rg_shared_face
  bindings:
    motion_file: /workspace/codexschema/phase1_fresh_20260711/assets/v4rg_runtime_order_v3/hope_forehand_v4rg_cal.npz
    motion_file_2: /workspace/codexschema/phase1_fresh_20260711/assets/v4rg_runtime_order_v3/hope_backhand_v4rg_cal.npz
x-bank: &bank
  action: signed_face_v4rg_shared_face
  train_path: /workspace/codexschema/phase1_signed_face_rescue_20260713/assets/schema3_bank_rebind_v2/s1_v4rg_runtime_order_schema3_train_882fea4_rebound.npz
  train_arg: ++task.racket.question_bank
x-exam: &exam
  action: signed_face_v4rg_shared_face
  path: /workspace/codexschema/phase1_signed_face_rescue_20260713/papers/signed_face_exam_k100_v1/signed_face_exam_k100.schedule.json
  family: signed_face_rebound_k100_v1

