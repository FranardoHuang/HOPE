        - ++task.plant.robot_material_dynamic_friction_range=[0.8,1.2]
        - ++task.rewards.foot_soft_landing_weight=-0.003
        - ++task.rewards.foot_soft_landing_force_threshold_n=300.0
        - ++task.rewards.action_acc_weight=-0.05
        - ++task.rewards.qdes_limit_barrier_weight=-0.65
        - ++task.rewards.qdes_limit_barrier_margin_frac=0.08
        - ++task.push.enable=true
        - ++task.push.interval_range_s=[5.0,15.0]
        - ++task.push.vel_xy_mps=0.35
        - ++task.push.ang_vel_radps=0.0
        - ++task.push.ang_axes=none
        - ++task.force_push.enable=true
        - ++task.force_push.interval_range_s=[5.0,15.0]
        - ++task.force_push.force_n=68.0
        - ++task.force_push.duration_s=0.3
    combo_franco:
      human_name: 人话：全升级合体·Franco 动作谱系——同 combo_resume，但反手动作（motion_file_2）换 franco_bh_loop_b（151 帧 @50Hz schema-2，唯一三证+六轴 scan 100%）。Franco：换动作是全面升级的优先消融，排位最前。franco_contract 闸门锁死：等 franco_pipeline_20260722 交付 grip 标定 bake + 锚入册 + 按族重绑题库三前置后才渲染
      motion_backhand_asset: franco
      temporal_overrides: *temporal_iu
      stability_overrides: *stability_s0
      extra_overrides: *extra_resume

# 人话：groundfoot 渲染闸门（grip/rough/落地罚/抬脚罚七键）。wiring 已确认：07-22
# groundfoot 合并 commit b9c8fff2 是本波钉住 commit（origin/main HEAD ad0110e8）的
# 祖先，train.py 白名单在钉住 commit 上逐字含这七键（2026-07-23 host 只读 grep 核对）。
# 发射前仍须 grep 远端 checkout 复核一遍（核对单第 2 条）。false 时渲染器拒绝出任何
# 臂的命令（三臂全都用 grip/落地罚键，fail-closed）。
groundfoot_contract:
  wiring_confirmed: true
  expected_cli_keys:
    - task.plant.robot_material_static_friction_range
    - task.plant.robot_material_dynamic_friction_range
    - task.plant.terrain_rough_height_range
    - task.rewards.foot_soft_landing_weight
    - task.rewards.foot_soft_landing_force_threshold_n
    - task.rewards.foot_clearance_weight
    - task.rewards.foot_clearance_target_m
  wiring_note: >-
    人话：grip 用材质范围两键（本波抬到全程高摩擦 [1.0,1.6]/[0.8,1.2]）；combo_fresh
    另用粗糙地形键与抬脚罚两键（target 0.15 m = hope_rewards 注释里"真要它抬腿跨步"
    档——凹凸地面就是为了逼抬腿，落地罚+抬脚罚成对，mjlab 档①）；落地冲击两键全臂
    都用。plant 键变动会进 schema-3 ground_plant 合同块——combo 的 checkpoint 从此与
    平地谱系互相拒绝静默续训，这是设计不是事故。exact 语义以 main 的实现+单测为机器真源。

# 人话：速度推渲染闸门（w_p035 键面五键）。wiring 已确认：07-21 push 波合并 commit
# 4624c824 是本波钉住 commit 的祖先，train.py _PUSH_KEYS =
# (enable, interval_range_s, vel_xy_mps, ang_vel_radps, ang_axes) 逐字核对。push 是
# 事件不是 reward（不进预算表）；axes=none 必须配 ang=0，错配 boot 即 fail-loud。
# false 时渲染器拒绝出任何臂的命令（三臂全带 push，fail-closed）。
push_contract:
  wiring_confirmed: true
  expected_cli_keys:
    - task.push.enable
    - task.push.interval_range_s
    - task.push.vel_xy_mps
    - task.push.ang_vel_radps
    - task.push.ang_axes
  wiring_note: >-
    人话：±0.35 m/s 档 = push 波 w_p035 臂键面逐字（PACE 与 BeyondMimic 之间的中档）。
    展开由 training_contract.push_robot_event_block 单源完成（对称 velocity_range）。
    发射前仍须 grep 远端 checkout 在 exact commit 上的 train.py 再核对一遍。

# 人话：力推渲染闸门（w_f035 键面四键，与速度推两组事件并存——Franco 07-23 变更②）。
# wiring 同在 push 波合并 commit；train.py _FORCE_PUSH_KEYS = (enable, interval_range_s,
# force_n, duration_s) 逐字核对。语义照 push 波 force_push_contract：施力点 =
# pelvis_link_origin（诚实标注非 COM，Yikang V9 教训）；68.0 N x 0.30 s /
# 58.27723163 kg（pod1 URDF 43 link 质量和，07-21 只读核对）= Δv_equiv 0.35005 m/s，
# 与速度推 p035 同冲量对表。力推也是事件不是 reward。false 时渲染器拒绝出任何臂的命令。
force_push_contract:
  wiring_confirmed: true
  expected_cli_keys:
    - task.force_push.enable
    - task.force_push.interval_range_s
    - task.force_push.force_n
    - task.force_push.duration_s
  wiring_note: >-
    人话：w_f035 键面逐字（68.0 N 水平恒力持续 0.30 s，每 5-15 s 一次，施在 pelvis
    link 原点）；同冲量对表速度推 p035（Δv_equiv=0.35005 m/s @ 58.27723163 kg，质量
    与换算出处见 configs/phase1_push_robustness_20260721.yaml force_push_contract）。
    运行时 training_contract 的 force_push 块必须记录真实读到的机器人总质量、Δv_equiv
    与 application_point。

# 人话：qbar barrier 渲染闸门（两键）。wiring 已确认：intel 波 qbar_contract 已远端
# grep 核对翻真，白名单键在钉住 commit 上逐字存在（本地 2026-07-23 复核）。语义裁定
# （07-22）：margin_frac=0.08 是【行程比例】不是 rad——与 jiayi V14
# all_joint_qdes_barrier_safe_margin_fraction: 0.08 完全同语义，落在外部经验"限位前
# 8-10% 就罚"带内；v_qbar 臂判卷反手 1.00 佐证该档不压击球。本波与 action_rate=-0.2
# 并存（intel 波 qbar 臂把 action_rate 归零是单变量设计，不是互斥铁律）。false 时
# 渲染器拒绝出任何臂的命令（三臂全带 barrier）。
qbar_contract:
  wiring_confirmed: true
  expected_cli_keys:
    - task.rewards.qdes_limit_barrier_weight
    - task.rewards.qdes_limit_barrier_margin_frac
  wiring_note: >-
    人话：全关节 q_des 限位 barrier——q_des 离限位不足 8% 行程时线性起罚，-0.65 权重。
    稀疏项：常态（不贴限位）恒 0，贴限位才付费，所以不挤占每步击球收入（比值审计表
    已注明）。发射前仍须 grep 远端 train.py 复核两键在白名单。

# 人话：action_acc 渲染闸门（mjlab 档①第三项：动作二阶平滑 action_acc_l2，
# 建议键 task.rewards.action_acc_weight）。与 kdpassive 同类——【源码未接线】：钉住
# commit 的 train.py 白名单 grep 无此键（2026-07-23 核对）。谁实现谁补单测（照
# foot_soft_landing 先例：默认 weight=0 字节等价、探针纪律、量纲断言），合入 main 后
# 重钉 source.commit 为新 40-hex、远端白名单核对一致，才翻 true。三臂全带此键，
# false 时渲染器拒绝出任何臂的命令（fail-closed）。剂量 -0.05 = action_rate(-0.2) 的
# 1/4，落在 mjlab 采纳文档"1/5~1/2 先小"带内（二阶差分量纲大于一阶，别按一阶惯用值抄）。
action_acc_contract:
  wiring_confirmed: false
  expected_cli_keys:
    - task.rewards.action_acc_weight
  wiring_note: >-
    人话：action_rate 罚"步子迈多大"，action_acc 罚"方向掉头多猛"——高频抖恰恰是一阶小、
    二阶大的信号，对抖动问题是正交新轴（mjlab 采纳文档档①第三项）。实现要求：
    Σ(a_t - 2a_{t-1} + a_{t-2})² 核、默认 weight=0 = 字节等价、复位后前两步不计费。
    实现+单测合入 main 并重钉 commit 前，本闸门锁死全部三臂。

# 人话：franco 渲染闸门（只锁 combo_franco）。franco_bh_loop_b 现状（07-22 动作资产
# 看板）：151 帧 @50Hz、唯一三证（L0/vendor L1/整轨桌网）+ 六轴 phase-scan 100%
# @0.59-0.61，但 scan 是未标定拍面口径，且训练侧注册/题库全没做。三前置全部交付后，
# 主控把 assets.motion_backhand_franco 从占位符换成 pod 真实 npz 路径 + sha256 入册，
# 才翻 wiring_confirmed=true；false 或占位符任一存在时渲染器拒绝出 combo_franco 的
# 任何命令（fail-closed），另两臂不受影响。
franco_contract:
  wiring_confirmed: false
  motion_asset_key: motion_backhand_franco
  motion_human_name: 人话：franco_bh_loop_b——Franco 反手拉 B 候选，151 帧 @50Hz schema-2，唯一三证 + 六轴 phase-scan 100% @0.59-0.61（母本 pod2 franco_set_cert_20260722）
  unlock_prerequisites:
    - franco_pipeline_20260722 交付 grip 标定 bake（B 的 phase-scan 现为未标定拍面口径，须把 grip 标定烤入 schema-2 资产才有训练口径）
    - franco_pipeline_20260722 交付空挥视觉锚点入册（锚进注册册；PROBE 件不得注册训练）
    - franco_pipeline_20260722 交付按族重绑题库（franco 反手族按族重绑训练题库，替换现役 v4rg 反手绑定）
  wiring_note: >-
    人话：换的是 motion_file_2（反手位），正手 motion_file 仍用 v4rg。三前置对应
    franco_pipeline_20260722 战役（SE2→schema-2→L0/L1/桌网→grip/锚→注册草案）的
    收尾三步；缺任何一步就发射＝拿未标定/未注册的动作污染训练谱系，闸门就是防这个。
    Franco 07-23 拍板：换动作是全面升级的优先消融，故 launch_order 排最前——闸门未开
    时跳过不阻塞，开了就第一个发。

# 人话：新增负项预算审计表（Franco 比值守卫，机器可校验部分在下面的
# reward_budget_contract 块）。
# 击球组每步收入（exp 核∈[0,1]，挥拍窗内）：racket_position 17 + racket_velocity 7 +
#   racket_normal 5（连续追踪三项）+ racket_strike_success 5（稀疏触球步）+
#   racket_progress 10 —— 标称 17/7/5/5/10，本波一个不动（前三项显式钉在 W 配方串，
#   后两项不带任何 override = 源码默认 5/10）。
# 新增负项每步量级（连续项 vs 稀疏项分开记）：
#   [连续] action_rate -0.2 x Σ(Δa)²：现役 -0.1 已在 24 格矩阵全谱系全程跑过、击球
#     未被压制（w_c_s0 台账），本波剂量 = 现役 2 倍（jiayi V14 关节抽动 = -0.1 太小
#     的证据）；
#   [连续] action_acc -0.05 x Σ(a_t-2a_{t-1}+a_{t-2})²：二阶量纲大于一阶，起步取
#     action_rate 的 1/4（mjlab 采纳文档"1/5~1/2 先小"带内）；源码未接线，闸门锁死；
#   [稀疏] foot_soft_landing -0.003 x 超阈倍数：单脚封顶 3、双脚合计 ≤6 → 每步最坏
#     |-0.018|，且只在 first-contact 步计费（站立击球 first-contact 稀少）；
#   [稀疏] foot_clearance -0.01 x |脚高-0.15|x水平脚速（只 combo_fresh）：只对腾空脚
#     计费，站立支撑常态为 0；量级示例 |0.15 差|x2 m/s x2 脚 ≈ 0.006/步（最坏）；
#   [稀疏] qdes_limit_barrier -0.65：q_des 离限位 >8% 行程时恒 0，贴限位才付费——
#     "贴限位才付费"的稀疏项，常态为 0（v_qbar 判卷反手 1.00 佐证不压击球）。
# 预算规则：五个新增负项每步合计量级 ≲ 击球组每步收入 x 1/3。
# 静态论证之外必须实测：probe + 首个里程碑（续训 model_6900 / fresh model_200）读
# tensorboard 逐项 episode 均值核对该比值，超限该臂停发 science/停训裁决（核对单）。
# 软惩罚组（face -0.4 / foot_ori -0.3 / upright -1.0）全额不动、不再叠加新软惩罚
# （penlight 教训：软限制压制模仿→学不会击球）；速度推/力推是事件不是 reward，不进本表。
reward_budget_contract:
  hitting_group_frozen:
    racket_position_weight: 17.0
    racket_velocity_weight: 7.0
    racket_normal_weight: 5.0
    racket_strike_success_weight_default: 5.0
    racket_progress_weight_default: 10.0
  new_negative_terms:
    action_rate_weight: -0.2
    action_acc_weight: -0.05
    foot_soft_landing_weight: -0.003
    foot_clearance_weight_fresh_only: -0.01
    qdes_limit_barrier_weight: -0.65
  budget_rule: >-
    人话：新增负项（action_rate + action_acc + foot_soft_landing + foot_clearance
    [仅 fresh] + qdes_limit_barrier）每步合计量级必须 ≲ 击球组每步收入的 1/3；
    barrier/落地罚/抬脚罚是稀疏项（贴限位/落地/腾空才付费，常态 0），连续项只有
    action_rate 与 action_acc。probe + 首个里程碑用 tensorboard 逐项实测核对，
    超限该臂停发 science/停训裁决。
  soft_penalty_rule: >-
    人话：软惩罚组不再叠加——face/foot_ori/upright 保持全额 -0.4/-0.3/-1.0，蹭滑/
    拖脚/挥拍前脚滑键一个不带（penlight 教训：软限制压制模仿→学不会击球）。
  push_rule: >-
    人话：速度推/力推都是事件不是 reward，不进预算表；键面逐字 = push 波
    w_p035 + w_f035 两臂（同冲量对表，两组事件并存）。

probe_contract:
  # 人话：三个稳定机制的测量探针在 3 臂全开——每臂都显式写三个机制 weight=0，
  # train.py 会因此强制对应 probe.weight=1.0；slew 探针由每臂显式的 hinge 键全程记录；
  # qbar barrier 自带 weight-independent 激活探针（train.py 合同强制成对声明）。
  post_swing_settle_debt: auto_forced_probe_weight_1p0_by_explicit_weight_key
  lower_body_stability_bundle: auto_forced_probe_weight_1p0_by_explicit_weight_key
  lower_body_pose_imitation: auto_forced_probe_weight_1p0_by_explicit_weight_key
  processed_qdes_slew: auto_probe_by_explicit_hinge_keys_in_every_cell
  qdes_limit_barrier: paired_activation_probe_enforced_by_train_py_contract

budgets:
  probe:
    num_envs: 4096
    num_steps_per_env: 24
    max_iterations: 2
    save_interval: 1
  science:
    # 人话：续训两臂——6700 + 13301 ≈ 20001，对齐 Jiayi 新目标 2万-2.5万 iter 的下沿。
    num_envs: 4096
    num_steps_per_env: 24
    max_iterations: 13301
    save_interval: 100
    milestone_offsets_from_parent: [200, 500, 1000, 2000, 4000, 6600, 10000, 13300]
    absolute_milestones: [6900, 7200, 7700, 8700, 10700, 13300, 16700, 20000]
  science_fresh:
    # 人话：combo_fresh 一臂 fresh-from-random 独立预算——从零到 20001，里程碑照 fresh
    # 谱系惯例。
    num_envs: 4096
    num_steps_per_env: 24
    max_iterations: 20001
    save_interval: 100
    absolute_milestones: [200, 500, 1000, 2000, 4000, 10700, 20000]

# 人话：本波不写死 pod/gpu——空槽出现时按此顺序拉最前面还没发射【且闸门已开】的臂
# 填入。排位（Franco 07-23 拍板）：combo_franco 最先——换动作是全面升级的优先消融；
# 然后 combo_resume（续训快出与 w_c_s0 可比的信号）；combo_fresh 垫底（独立谱系，
# 20001 从零最贵）。franco 闸门未开时跳过不阻塞（先发 combo_resume）。整波在全局
# 队列的排位 = franco_pipeline_20260722 战役完成且卡上有空槽之后（见预注册文档）。
launch_order:
  - combo_franco
  - combo_resume
  - combo_fresh

jobs:
  - {id: combo_fresh, parent: W, fresh_from_random: true, arm: combo_fresh, run_name: p1iu_combo_fresh_seed3_20260723, run_dir: /workspace/codexschema/phase1_integrated_upgrade_wave_20260723/runs/combo_fresh}
  - {id: combo_resume, parent: W, fresh_from_random: false, arm: combo_resume, run_name: p1iu_combo_resume_seed3_20260723, run_dir: /workspace/codexschema/phase1_integrated_upgrade_wave_20260723/runs/combo_resume}
  - {id: combo_franco, parent: W, fresh_from_random: false, arm: combo_franco, run_name: p1iu_combo_franco_seed3_20260723, run_dir: /workspace/codexschema/phase1_integrated_upgrade_wave_20260723/runs/combo_franco}
