      human_name: 人话：全升级合体·fresh 谱系——C+S0 + action_rate -0.2 + 全程高摩擦 + 凹凸地形 2-6 cm + mjlab 档①三项（落地罚/抬脚罚/二阶平滑）+ qbar barrier + 速度推 ±0.35 + 同冲量力推 68 N，fresh-from-random 从零训 20001（rough 铁律：平地 checkpoint 不能静默上粗糙地，带凹凸的臂必须从零；抬脚罚只在本臂——凹凸地面就是为了逼抬腿，落地罚+抬脚罚成对）
