schema_version: 1
queue_id: phase1_integrated_upgrade_wave_20260723
purpose: >-
  人话：集成升级波 3 臂（Franco 拍板：把已证明有用的升级一次性合体 go for a try；
  07-23 审查后五处变更+两条追加已并入本设计）。基座固定矩阵 C+S0（W 配方串、三稳定
  机制 weight=0、探针全开），合体内容：action_rate -0.1→-0.2（实证依据＝jiayi V14
  关节抽动——现役 -0.1 太小的证据）+ 全程高摩擦（静 [1.0,1.6]/动 [0.8,1.2]，Franco：
  0.6 太低——摩擦当已知量拉高，失稳轴交给 push/凹凸）+ mjlab 档①三项全收（落地罚
  -3e-3 @300 N、抬脚罚 -0.01 @0.15 m 只进凹凸臂、动作二阶平滑 -0.05——源码未接线，
  action_acc 闸门锁死）+ qbar 全关节 qdes 限位 barrier（-0.65/margin_frac 0.08，
  我们 V14 验证档，落在外部经验"限位前 8-10% 就罚"带内；v_qbar 臂判卷反手 1.00
  佐证；与 action_rate 并存——intel 波是单变量才互斥）+ 随机速度推 ±0.35 m/s（push
  波 w_p035 键面逐字）+ 同冲量力推 68 N x 0.30 s（push 波 w_f035 键面逐字，两组事件
  并存）。combo_fresh 另加凹凸地形 2-6 cm + 抬脚罚成对（凹凸地面就是为了逼抬腿），
  fresh-from-random 铁律从零 20001；combo_resume 从 W model_6700 续训 13301（平地
  谱系不能上凹凸，ground_plant 合同保证）；combo_franco = combo_resume + 反手动作换
  franco_bh_loop_b（151f schema-2，franco_contract 闸门锁死等 franco_pipeline_20260722
  三交付；Franco：换动作是全面升级的优先消融，排位最前）。对照＝矩阵 w_c_s0 不重复买。
  reward 比值守卫（Franco 强调）：击球组 17/7/5/5/10 一动不动；新增负项每步合计量级
  ≲ 击球收入 1/3（见 reward_budget_contract 审计表，barrier/抬脚罚等稀疏项已注明）；
  软惩罚组不再叠加（penlight 教训：软限制压制模仿→学不会击球）；push/力推是事件不是
  reward。判读 caveat：combo 臂赢了也不能归因单项——单项归因永远看各单变量波
  （CGF/push/intel）。本波不写死 pod/gpu：空槽即填，渲染时注入目标卡。只渲染命令供
  人工核对后执行，本队列只做仿真，永不驱动真实机器人。
simulation_only: true
real_robot_authorized: false
launch_authorized_by_default: false
formal_exact_eligible: false
evidence_class: diagnostic_only_intentional_parent_contract_mismatch

ssh:
  key: ~/.ssh/id_ed25519_runpod
pods:
  # 人话：端点照抄 07-22 下午恢复后的实测值；pod 端口重启即变，渲染前若变须先改这里
  # （渲染出的命令带端口，错端口连不上无害）。
  pod1: {host: 162.43.172.171, port: 18333, gpus: [0, 1, 2]}
  pod2: {host: 162.43.172.181, port: 13146, gpus: [0, 1, 2]}

namespace:
  root: /workspace/codexschema/phase1_integrated_upgrade_wave_20260723
  no_clobber: true
  automatic_retry: false

source:
  # 人话：地面摩擦/粗糙地形/落地罚/抬脚罚键（07-22 groundfoot 合并 b9c8fff2）、
  # task.push.*/task.force_push.*（07-21 push 波合并 4624c824）、qbar barrier 两键
  # （intel 波已远端核对）都已在 main——两个合并 commit 均已验证为 origin/main 祖先，
  # train.py 白名单在钉住 commit 上逐字含上述全部键。唯一例外：action_acc_weight
  # （mjlab 档①第三项）源码未接线——action_acc_contract 闸门锁死渲染，实现+单测合入
  # main 后须重钉新 40-hex 再翻 true。source.commit = 预注册当日 origin/main HEAD。
  checkout: /workspace/codexschema/nohope_iu_20260723
  identity_mode: clean_detached_exact_commit
  commit: "ad0110e88cf9c481247b0d554430d5585f13bcd2"
  worktree_relative: hope_training/whole_body_tracking
  python: /workspace/hope_isaac_venv/bin/python
  setup_relative: setup_train_env.sh
  trainer_relative: scripts/train.py
  locked_launcher_relative: scripts/launch_kit_training_locked.sh
  note: >-
    人话：训练从干净的 detached 精确 commit 检出跑；W 与后代 hard contract 有意
    mismatch（grip/rough 键还会因 ground_plant 合同块 mismatch——这正是指纹在工作），
    所以整条谱系永远不算 formal-exact，胜者档位须另在 exact-lineage 重跑。渲染闸门：
    groundfoot/push/force_push/qbar 四合同已确认（wiring 都在钉住 commit 上，发射前仍
    须 grep 远端 checkout 复核）；action_acc_contract 锁全部三臂（源码未接线）；
    franco_contract 锁 combo_franco（等 franco_pipeline_20260722 三交付）。combo_fresh
    另受 fresh_from_random 铁律（平地 checkpoint 禁止静默上粗糙地——ground_plant
    合同块会拒，本波直接不传 resume）。

watchdog:
  # 人话：逐字继承 CGF/intel wave——boot 停滞 1800 s（Kit 编译 shader 可安静 10 分钟+）、
  # 首迭代后停滞 900 s 才判死；不用 launch_kit_training_locked.sh 的 180 s stale 门
  # （v8/v9 死因）。唯一允许的重试是逐字重发一次，run_name 加 _r2 后缀。
  boot_stall_timeout_s: 1800
  post_first_iteration_stall_timeout_s: 900
  retry_policy: one_verbatim_retry_suffix_r2
  retry_note: 人话：唯一允许的重试是逐字重发一次，run_name 加 _r2 后缀，仍需人工核对。

assets:
  a3_runtime_asset_root: /workspace/codexschema/nohope_balance_action_slew_20260720/hope_training/whole_body_tracking/source/whole_body_tracking/whole_body_tracking/assets/agibot_a3
  preconverted_a3_usd: /workspace/codexschema/simple_half_second_sprint_20260718/assets/a3_preconverted_usd/model.usd
  motion_forehand: /workspace/codexschema/phase1_fresh_20260711/assets/v4rg_runtime_order_v3/hope_forehand_v4rg_cal.npz
  motion_backhand: /workspace/codexschema/phase1_fresh_20260711/assets/v4rg_runtime_order_v3/hope_backhand_v4rg_cal.npz
  # 人话：combo_franco 专用反手资产（franco_bh_loop_b 151f schema-2）。占位符 =
  # franco_pipeline_20260722 战役还没交付；三前置交付后主控换成 pod 真实 npz 路径 +
  # sha256 入册，franco_contract 才允许翻 true。占位符存在时渲染器拒绝出 combo_franco
  # 的任何命令（另两臂不受影响）。
  motion_backhand_franco: PENDING_FRANCO_PIPELINE_DELIVERY
  training_question_bank: /workspace/codexschema/phase1_signed_face_rescue_20260713/assets/schema3_bank_rebind_v2/s1_v4rg_runtime_order_schema3_train_882fea4_rebound.npz

controls:
  # 人话：对照不重复买——矩阵 w_c_s0（同 C+S0 配方、W 配方串、平地、摩擦默认、无脚部
  # reward、无 barrier、无 push、action_rate=-0.1）就是 combo_resume 的对照，汇总时
  # 直接对比里程碑。combo_fresh 是 fresh-from-random 粗糙地谱系，没有干净同谱系对照
  # ——判读只看"能不能在粗糙地上学会站着击球"的绝对水平与失稳率（写结论必须带谱系
  # caveat）。
  baseline_queue_id: phase1_balance_temporal_matrix_20260720
  baseline_jobs: [w_c_s0]
  baseline_run_names: [p1btm_w_c_s0_seed3_20260720]
  human_note: >-
    人话：矩阵 w_c_s0 = 本波去掉全部升级后的基础配方（C+S0、action_rate=-0.1、平地、
    默认摩擦、无脚部 reward、无 barrier、无 push），不再另买对照臂。combo 对 w_c_s0
    的差 = 全部升级的合计效应；单项归因看 CGF/push/intel 各单变量臂，本波不承担归因。

