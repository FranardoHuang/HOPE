# 人话：3 条 combo 臂。每臂显式携带完整 temporal（5 行，action_rate 统一 -0.2——实证
# 依据：jiayi V14 报告的关节抽动就是现役 -0.1 太小的证据，别人经验 0.1 一路测到 1）
# 与 stability（S0 全 0 档）串（COMMON 冻结设计）。合体升级全部走 extra_overrides
# 纯加键：
#   grip 两键（全程高摩擦 [1.0,1.6]/[0.8,1.2]——Franco：0.6 太低；摩擦当已知量拉高，
#     失稳轴交给 push/凹凸）
#   + mjlab 档①三项（落地罚两键；抬脚罚两键只进 combo_fresh——凹凸地面就是为了逼抬腿，
#     落地罚+抬脚罚成对；action_acc 一键=动作二阶平滑，源码未接线、闸门锁死）
#   + qbar barrier 两键（-0.65/margin_frac 0.08 我们 V14 验证档，落在外部经验"限位前
#     8-10% 就罚"带内；v_qbar 判卷反手 1.00 佐证；与 action_rate=-0.2 并存——intel 波
#     是单变量设计才互斥，本波合体）
#   + 速度推五键（w_p035 键面逐字）+ 力推四键（w_f035 键面逐字，两组事件并存）。
# combo_fresh 另加 rough 一键。motion_backhand_asset 只有 combo_franco 是 franco
# （反手动作换 franco_bh_loop_b），另两臂 default（v4rg 反手）。
