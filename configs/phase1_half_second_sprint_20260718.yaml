schema_version: 1
name: phase1_half_second_sprint_20260718
purpose: >-
  用同一个 model_5700 单 seed 热启动，快速比较二十三种“半秒内完成击球”训练问题。
  这里保留公共输入和每格真正改变的参数，不复制旧队列的发布流程，也不做
  SHA、receipt、claim 或 activation 流程。
simulation_only: true

simple_launch:
  bookkeeping: none
  forbidden_prelaunch_ceremony: [sha, receipt, claim, activation]
  startup_checks:
    - configuration_parses
    - first_training_iteration_appears
    - fatal_log_scan_is_clean
  note: >-
    启动前只检查参数能解析；启动后只等第一个训练 iteration 并扫 fatal。
    训练结论由 checkpoint 行为读数给出，不让发布式账本阻塞 GPU。

common:
  source_checkout: /workspace/codexschema/nohope_task_revision_b1f5a38
  cached_usd_successor_source: /workspace/codexschema/nohope_halfsecond_cachedusd_latest
  preconverted_a3_usd: /workspace/codexschema/simple_half_second_sprint_20260718/assets/a3_preconverted_usd/model.usd
  parent_checkpoint: /workspace/codexschema/nohope_task_revision_b1f5a38/hope_training/whole_body_tracking/logs/rsl_rl/agibot_a3_hope_virtualball/2026-07-16_20-04-47_phase1_taskrev_p2_equal_reward_seed3_20260716/model_5700.pt
  resume: full_policy_value_optimizer_normalizer
  seed: 3
  motion_files:
    forehand: /workspace/codexschema/phase1_fresh_20260711/assets/v4rg_runtime_order_v3/hope_forehand_v4rg_cal.npz
    backhand: /workspace/codexschema/phase1_fresh_20260711/assets/v4rg_runtime_order_v3/hope_backhand_v4rg_cal.npz
  training_question_bank: /workspace/codexschema/phase1_signed_face_rescue_20260713/assets/schema3_bank_rebind_v2/s1_v4rg_runtime_order_schema3_train_882fea4_rebound.npz
  runtime:
    num_envs: 4096
    additional_updates_initial: 1001
    winner_extension_to_updates: 4001
    save_interval_updates: 100
  inherited_recipe: phase1_task_revision_model_5700
  baseline_reward_settings:
    task.rewards.joint_velocity_limit_hinge_weight: -5.0
    task.rewards.action_rate_weight: -0.1
    task.rewards.motion_scale: 1.0
    task.rewards.motion_scale_in_window: 0.25
    task.rewards.racket_position_weight: 9.67
    task.rewards.racket_velocity_weight: 9.67
    task.rewards.racket_normal_weight: 9.66
    task.rewards.foot_orientation_weight: -0.3
    task.rewards.prestrike_upright_weight: -1.0
    task.rewards.free_non_striking_arm_mimic: false

time_to_strike_components:
  late_stress: {range_s: [0.36, 0.49]}
  exact_half_second: {range_s: [0.50, 0.50]}
  fast_deploy: {range_s: [0.50, 0.90]}
  broad_arrival: {range_s: [0.90, 1.70]}

curricula:
  short_focus:
    human_name: 半秒为主、仍保留更短压力和少量长来球
    weights: {late_stress: 0.10, exact_half_second: 0.45, fast_deploy: 0.40, broad_arrival: 0.05}
  ultra_half:
    human_name: 极强半秒点质量
    weights: {late_stress: 0.05, exact_half_second: 0.70, fast_deploy: 0.20, broad_arrival: 0.05}
  feasible:
    human_name: 更多可完成的快速与长准备样本
    weights: {late_stress: 0.05, exact_half_second: 0.10, fast_deploy: 0.45, broad_arrival: 0.40}
  legacy_focus_1:
    human_name: 已启动旧 focus 课程，仅用于解释当前 run
    weights: {late_stress: 0.25, exact_half_second: 0.40, fast_deploy: 0.25, broad_arrival: 0.10}
  legacy_balanced:
    human_name: 已启动旧 balanced 课程，仅用于解释当前 run
    weights: {late_stress: 0.15, exact_half_second: 0.20, fast_deploy: 0.30, broad_arrival: 0.35}

cells:
  - id: control
    human_name: 短准备课程对照
    question: 只改变准备时间分布，model_5700 能否开始完成半秒击球？
    curriculum: short_focus
    overrides: {}

  - id: focus_qdot0
    human_name: 短准备课程并关闭关节速度铰链惩罚
    question: 关节速度铰链惩罚是否是半秒动作来不及的主要瓶颈？
    curriculum: short_focus
    overrides:
      task.rewards.joint_velocity_limit_hinge_weight: 0.0

  - id: ultra_half
    human_name: 七成题严格给半秒
    question: 更密集的半秒样本是否比普通短准备课程学得更快？
    curriculum: ultra_half
    overrides: {}

  - id: feasible
    human_name: 先用较多可完成样本搭学习台阶
    question: 先提高快速与长准备样本的完成率，能否再迁移到半秒？
    curriculum: feasible
    overrides: {}

  - id: actionrate0
    human_name: 关闭动作变化率惩罚
    question: action-rate 平滑惩罚是否阻止策略快速起拍？
    curriculum: short_focus
    overrides:
      task.rewards.action_rate_weight: 0.0

  - id: window_mimic0
    human_name: 触球窗内老师动作完全静音
    question: 临近触球时，老师模仿是否与实时球拍目标冲突？
    curriculum: short_focus
    overrides:
      task.rewards.motion_scale_in_window: 0.0

  - id: global_mimic_half
    human_name: 全程老师动作降到一半
    question: 把模仿降为较软先验，能否让实时球拍目标主导？
    curriculum: short_focus
    overrides:
      task.rewards.motion_scale: 0.5

  - id: position_heavy
    human_name: 固定总预算下更重视拍心到位
    question: 先让拍心赶到球附近，是否比同时追拍速和拍面更容易起步？
    curriculum: short_focus
    overrides:
      task.rewards.racket_position_weight: 17.0
      task.rewards.racket_velocity_weight: 7.0
      task.rewards.racket_normal_weight: 5.0

  - id: strong_ready
    human_name: 加强脚姿态和击球前直立稳定
    question: 更强准备姿态约束能否在加速起拍时守住平衡？
    curriculum: short_focus
    overrides:
      task.rewards.foot_orientation_weight: -0.6
      task.rewards.prestrike_upright_weight: -2.0

  - id: free_arm
    human_name: 非击球臂不再模仿老师
    question: 放开非击球臂后，它能否更专注于快速动作中的平衡控制？
    curriculum: short_focus
    overrides:
      task.rewards.free_non_striking_arm_mimic: true

  - id: ready_free
    human_name: 强准备姿态加自由非击球臂
    question: 准备姿态奖励与自由非击球臂组合是否优于各自单独使用？
    curriculum: short_focus
    overrides:
      task.rewards.foot_orientation_weight: -0.6
      task.rewards.prestrike_upright_weight: -2.0
