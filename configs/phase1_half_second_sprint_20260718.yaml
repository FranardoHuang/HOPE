rejected_or_stopped_attempts:
  - attempts: [B, C]
    reason: 参数前缀替换误伤相邻权重，Hydra 配置解析失败
    stage: before_first_iteration
  - attempts: [D]
    reason: 多个 Kit 同时导入时 importer rc134
    stage: before_first_iteration
  - attempts: [G]
    reason: 生成脚本时把参数追加到 shebang，脚本未启动训练
    stage: before_first_iteration
  - attempts: [H, H3]
    reason: H 使用无效配置键；H3 使用无效 CUDA device
    stage: before_first_iteration
  - attempts: [I2]
    reason: importer 挂起；核对精确进程组后只停止该次尝试
    stage: importer
  - attempts: [O3]
    reason: 重复发射；在第一个 iteration 前只停止重复实例
    stage: before_first_iteration
  - attempts: [S2]
    reason: importer malloc 失败
    stage: before_first_iteration
  - attempts: [S3]
    reason: importer 挂起；核对精确进程组后只停止该次尝试
    stage: importer
  - attempts: [S4]
    reason: importer 挂起；核对精确进程组后只停止该次尝试
    stage: importer
  - attempts: [Z, Z2]
    reason: >-
      同一 velocity_window0 配方在 GPU2 第四路冷启动时，两次均在 env/reward
      构造前的 Kit USD shader discovery 以 malloc invalid size 自然退出；
      保留日志，不做第三次盲试，不判科学配方失败
    stage: before_environment

pod1_capacity:
  accepted_running: 11
  empty_slots: 1
