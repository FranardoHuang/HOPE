    scientific_question: does_about_1s_preparation_preserve_speed_and_balance_under_the_shared_core
    launch_round: 1
    action: *action
    status: blocked
    blocker: *blocker
    motion: *motion
    bank: *bank
    exam: *exam
    source: *source
    runtime_binding: true
    warm_start: *pod1_warm_start
    recipe:
      base: *base
      delta:
        - ++task.motion.speed_scale_per_clip=[1.32,1.0]
    seed: 3
    budget: *budget
    milestones: *milestones
    milestone_semantics: offsets_from_attested_parent
    resource: *pod1_gpu0
    formal_evidence_eligible: false
    run_name: phase1_rolling_p1_t10_comp2_j0_std_f03_seed3_20260716
    run_dir: /workspace/codexschema/phase1_rolling_timing_supercombo_20260716/runs/p1_t10_comp2_j0_std_f03

