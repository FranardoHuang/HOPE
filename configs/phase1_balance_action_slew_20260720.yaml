schema_version: 1
queue_id: phase1_balance_action_slew_20260720
purpose: >-
  Diagnostic W/V matched-parent ablation of the inherited dense raw-action
  difference penalty versus no slew penalty versus a recovery-only processed
  q_des slew hinge.  This queue is simulation-only and never drives a robot.
simulation_only: true
real_robot_authorized: false
launch_authorized_by_default: false
formal_exact_eligible: false
evidence_class: diagnostic_only_intentional_parent_contract_mismatch

ssh:
  key: ~/.ssh/id_ed25519_runpod
pods:
  pod1: {host: 162.43.172.171, port: 18333, gpus: [0, 1, 2]}
  pod2: {host: 162.43.172.181, port: 13146, gpus: [0, 1, 2]}

namespace:
  root: /workspace/codexschema/phase1_balance_action_slew_v7_20260720
  no_clobber: true
  automatic_retry: false

source:
  checkout: /workspace/codexschema/nohope_balance_action_slew_20260720
  identity_mode: clean_detached_exact_commit
  commit: 54c9a62656f0e60e5bb41cbcfa0e5a972b793906
  worktree_relative: hope_training/whole_body_tracking
  python: /workspace/hope_isaac_venv/bin/python
  setup_relative: setup_train_env.sh
  trainer_relative: scripts/train.py
  locked_launcher_relative: scripts/launch_kit_training_locked.sh
  required_relative_files:
    - scripts/exact_process_group.py
    - source/whole_body_tracking/whole_body_tracking/tasks/tracking/mdp/hope_actions.py
    - source/whole_body_tracking/whole_body_tracking/tasks/tracking/mdp/hope_rewards.py
    - source/whole_body_tracking/whole_body_tracking/tasks/tracking/config/agibot_a3/hope_env_cfg.py
  note: >-
    Training runs from a clean detached checkout of the exact registered commit.
    The intentional W/V hard-contract mismatch keeps every descendant formal-exact
    ineligible even when the source checkout is clean.

launch_manifest_contract:
  schema_version: 1
  status: explicit_reviewed_manifest_required_per_authorized_render
  manifest_is_separate_reviewed_input: true
  required_cli: [--launch-manifest, --expected-launch-manifest-sha256]
  required_bindings:
    - exact_clean_source_commit_and_required_source_file_sha256
    - queue_config_and_queue_runner_sha256
    - a3_runtime_asset_tree_sha256_file_count_and_total_bytes
    - preconverted_usd_exact_file_and_six_file_bundle_tree_motion_bank_checkpoint_and_parent_contract_sha256
  claim_publish: exclusive_no_clobber_before_trainer_start
  probe_receipt_basename: probe_receipt.json
  probe_verifier_publish: exclusive_no_clobber_after_natural_exit
  train_unlock: all_six_local_probe_receipts_must_verify
  automatic_probe_approval: false
  note: >-
    Every authorized command render must explicitly supply one separately reviewed
    manifest and its exact file digest.  A checked-in manifest is not ambient launch
    authority, and no placeholder digest is accepted.

assets:
  a3_runtime_asset_root: /workspace/codexschema/nohope_balance_action_slew_20260720/hope_training/whole_body_tracking/source/whole_body_tracking/whole_body_tracking/assets/agibot_a3
  preconverted_a3_usd: /workspace/codexschema/simple_half_second_sprint_20260718/assets/a3_preconverted_usd/model.usd
